  }
  if(!paused){
    const p = PAUSE_BTN;
    const hover = mouse.x>=p.x&&mouse.x<=p.x+p.w&&mouse.y>=p.y&&mouse.y<=p.y+p.h;
    ctx.fillStyle = hover ? "#fff3c4" : "#f4e4c8";
    ctx.strokeStyle = "#8b5a2b"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, p.h, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#8b5a2b";
    ctx.fillRect(p.x+12, p.y+10, 5, 16);
    ctx.fillRect(p.x+23, p.y+10, 5, 16);
  }
}

/* ===== 更新逻辑 ===== */
function update(dt, now){
  if(state !== "play" || paused) return;
  /* 黑夜无天降阳光 */
  if(!isNightLevel()){
    sunDropTimer -= dt;
    if(sunDropTimer <= 0){
      sunDropTimer = SUN_DROP_INTERVAL * getDiff().sunIntervalMul * (0.7 + rng()*0.6);
      const sx = GRID_X + 30 + rng()*(COLS*CELL_W-60);
      suns.push({x:sx, y:-20, ty: GRID_Y + 40 + rng()*(ROWS*CELL_H-80), anim:now, life:SUN_LIVE_TIME, falling:true, value:SUN_VALUE});
    }
  }
  for(let i=suns.length-1;i>=0;i--){
    const s = suns[i];
    s.anim = now;
    if(s.flying){
      s.flyT += dt;
      const t = Math.min(s.flyT/s.flyDur, 1);
      const ease = 1 - Math.pow(1-t, 3);
      s.x = s.fromX + (s.toX - s.fromX) * ease;
      s.y = s.fromY + (s.toY - s.fromY) * ease - Math.sin(t*Math.PI)*50;
      if(t >= 1){
        const v = s.value != null ? s.value : SUN_VALUE;
        sun += v;
        collectedSun += v;
        actionLog.push({t:performance.now(), e:"sun"});
        spawnParticle(s.toX, s.toY, "#ffd24a", 6);
        suns.splice(i,1);
      }
    } else if(s.bouncing){
      s.vy += s.g * dt;
      s.y += s.vy * dt;
      if(s.y >= s.ty){
        s.y = s.ty;
        if(s.bounced < 1 && s.vy > 0.12){
          s.vy = -s.vy * 0.4;
          s.bounced++;
        } else {
          s.bouncing = false;
          s.vy = 0;
        }
      }
      s.life -= dt;
      if(s.life <= 0) suns.splice(i,1);
    } else {
      if(s.falling){
        if(s.y < s.ty) s.y += 40*dt/1000;
        else { s.y = s.ty; s.falling = false; }
      }
      s.life -= dt;
      if(s.life <= 0) suns.splice(i,1);
    }
  }
  const maxWaves = isEndless() ? Infinity : NUM_FLAGS*10;
  if(zombiesToSpawn.length === 0 && waveIndex < maxWaves){
    waveTimer -= dt;
    if(waveTimer <= 0){
      waveIndex++;
      zombiesToSpawn = buildWave(waveIndex);
      if(waveIndex % 10 === 0) bigWaveWarning = 2500;
      const gapScale = isEndless() ? Math.max(0.55, 1 - waveIndex*0.008) : 1;
      waveTimer = ((waveIndex % 10 === 0) ? 22000 : (12000 + rng()*6000)) * gapScale;
      spawnTimer = 0;
    }
  } else if(zombiesToSpawn.length > 0){
    spawnTimer -= dt;
    if(spawnTimer <= 0){
      const kind = zombiesToSpawn.shift();
      const row = Math.floor(rng()*ROWS);
      const cy = GRID_Y + row*CELL_H + CELL_H/2 + 6;
      const zt = ZOMBIE_TYPES[kind] || ZOMBIE_TYPES.normal;
      const diff = getDiff();
      const endlessScale = isEndless() ? (1 + Math.min(waveIndex, 60) * 0.012) : 1;
      const hpMul = diff.hpMul * endlessScale;
      zombies.push({
        x: SPAWN_X + rng()*30, y: cy, row:row, kind:kind,
        hp: Math.round(zt.hp * hpMul),
        helmet: Math.round(zt.helmet * hpMul),
        maxHelmet: Math.round(zt.helmet * hpMul),
        speedMul: diff.speedMul * (isEndless() ? (1 + Math.min(waveIndex, 50)*0.006) : 1),
        anim: now, walkT:0, attackT:0, attackTarget:null, dead:false,
        hasPole: kind==="polevaulter", jumping:false, jumpProgress:0,
        slowed: 0, enraged: false
      });
      spawnTimer = Math.max(280, (600 + rng()*800) * (isEndless() ? Math.max(0.45, 1 - waveIndex*0.01) : 1));
    }
  }
  if(bigWaveWarning > 0) bigWaveWarning -= dt;

  /* 植物更新 */
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      const p = grid[y][x];
      if(!p) continue;
      p.anim = now;
      if(p.bounceT) p.bounceT = Math.max(0, p.bounceT - dt);
      if(p.type === "sunflower"){
        p.sunTimer -= dt;
        if(p.sunTimer <= 0){
          p.sunTimer = SUNFLOWER_INTERVAL;
          p.bounceT = 300;
          const ox = (rng()-0.5)*40;
          suns.push({x:p.cx+ox, y:p.cy-15, ty:p.cy+20, vy:-0.38, g:0.0014, bounced:0, anim:now, life:SUN_LIVE_TIME, falling:false, bouncing:true});
        }
      } else if(p.type === "peashooter"){
        let hasZ = false;
        for(const z of zombies){ if(z.row===y && !z.dead && !z.hypno && z.x > p.cx){ hasZ=true; break; } }
        if(hasZ){
          p.shootTimer -= dt;
          if(p.shootTimer <= 0){
            p.shootTimer = PEA_INTERVAL;
            bullets.push({x:p.cx+18, y:p.cy-6, row:y, dmg:BULLET_DAMAGE, anim:now});
          }
        } else {
          p.shootTimer = Math.min(p.shootTimer, PEA_FIRST_DELAY);
        }
      } else if(p.type === "repeaterpea"){
        if(p.secondShotT > 0){
          p.secondShotT -= dt;
          if(p.secondShotT <= 0){
            bullets.push({x:p.cx+18, y:p.cy-6, row:y, dmg:BULLET_DAMAGE, anim:now});
            p.secondShotT = 0;
          }
        }
        let hasZ2 = false;
        for(const z of zombies){ if(z.row===y && !z.dead && !z.hypno && z.x > p.cx){ hasZ2=true; break; } }
        if(hasZ2){
          p.shootTimer -= dt;
          if(p.shootTimer <= 0){
            p.shootTimer = PEA_INTERVAL;
            bullets.push({x:p.cx+18, y:p.cy-6, row:y, dmg:BULLET_DAMAGE, anim:now});
            p.secondShotT = 100;
          }
        } else {
          p.shootTimer = Math.min(p.shootTimer, PEA_FIRST_DELAY);
        }
      } else if(p.type === "snowpea"){
        let hasZ = false;
        for(const z of zombies){ if(z.row===y && !z.dead && !z.hypno && z.x > p.cx){ hasZ=true; break; } }
        if(hasZ){
          p.shootTimer -= dt;
          if(p.shootTimer <= 0){
            p.shootTimer = PEA_INTERVAL;
            bullets.push({x:p.cx+18, y:p.cy-6, row:y, dmg:BULLET_DAMAGE, anim:now, ice:true});
          }
        } else {
          p.shootTimer = Math.min(p.shootTimer, PEA_FIRST_DELAY);
        }
      } else if(p.type === "threepeater"){
        let hasZ3 = false;
        for(let dy=-1;dy<=1;dy++){
          const ry = y + dy;
          if(ry < 0 || ry >= ROWS) continue;
          for(const z of zombies){ if(z.row===ry && !z.dead && !z.hypno && z.x > p.cx){ hasZ3=true; break; } }
        }
        if(hasZ3){
          p.shootTimer -= dt;
          if(p.shootTimer <= 0){
            p.shootTimer = PEA_INTERVAL;
            for(let dy=-1;dy<=1;dy++){
              const ry = y + dy;
              if(ry < 0 || ry >= ROWS) continue;
              const ty = GRID_Y+ry*CELL_H+CELL_H/2-6;
              bullets.push({x:p.cx+18, y:p.cy-6, startY:p.cy-6, targetY:ty, startX:p.cx+18, row:ry, dmg:BULLET_DAMAGE, anim:now});
            }
          }
        } else {
          p.shootTimer = Math.min(p.shootTimer, PEA_FIRST_DELAY);
        }
      } else if(p.type === "chomper"){
        if(p.chewing){
          p.chewTimer -= dt;
          if(p.chewTimer <= 0) p.chewing = false;
        } else {
          for(const z of zombies){
            if(!z.dead && z.row===y && z.x > p.cx && z.x - p.cx < CELL_W*1.8){
              z.hp = 0; z.dead = true;
              if(!z._counted){ z._counted = true; killCount++; actionLog.push({t:now, e:"kill"}); }
              spawnParticle(z.x, z.y, "#9a5ab8", 12);
              p.chewing = true;
              p.chewTimer = 30000;
              break;
            }
          }
        }
      } else if(p.type === "potatomine"){
        if(!p.armed){
          p.armTimer -= dt;
          if(p.armTimer <= 0) p.armed = true;
        } else {
          for(const z of zombies){
            if(!z.dead && z.row===y && Math.abs(z.x - p.cx) < 30){
              explode(p.cx, p.cy, POTATO_DAMAGE, y, 1);
              p.hp = 0;
              break;
            }
          }
        }
      } else if(p.type === "cherrybomb"){
        p.fuse -= dt;
        if(p.fuse <= 0){
          explode(p.cx, p.cy, CHERRY_DAMAGE, y, 3);
          p.hp = 0;
        }
      } else if(p.type === "sunshroom"){
        if(!p.grown){
          p.growTimer = (p.growTimer||SUNSHROOM_GROW) - dt;
          if(p.growTimer <= 0) p.grown = true;
        }
        p.sunTimer -= dt;
        if(p.sunTimer <= 0){
          p.sunTimer = SUNFLOWER_INTERVAL;
          p.bounceT = 300;
          const ox = (rng()-0.5)*40;
          const val = p.grown ? SUN_VALUE : SUNSHROOM_SMALL;
          suns.push({x:p.cx+ox, y:p.cy-15, ty:p.cy+20, vy:-0.38, g:0.0014, bounced:0, anim:now, life:SUN_LIVE_TIME, falling:false, bouncing:true, value:val});
        }
      } else if(p.type === "puffshroom"){
        let hasZ = false;
        for(const z of zombies){
          if(z.row===y && !z.dead && !z.hypno && z.x > p.cx && z.x - p.cx < PUFF_RANGE*CELL_W){ hasZ=true; break; }
        }
        if(hasZ){
          p.shootTimer -= dt;
          if(p.shootTimer <= 0){
            p.shootTimer = PEA_INTERVAL;
            bullets.push({x:p.cx+12, y:p.cy+2, row:y, dmg:BULLET_DAMAGE, anim:now, maxX:p.cx+PUFF_RANGE*CELL_W, puff:true, spore:true});
          }
        } else p.shootTimer = Math.min(p.shootTimer, PEA_FIRST_DELAY);
      } else if(p.type === "fumeshroom"){
        let hasZ = false;
        for(const z of zombies){
          if(z.row===y && !z.dead && !z.hypno && z.x > p.cx && z.x - p.cx < FUME_RANGE*CELL_W){ hasZ=true; break; }
        }
        if(hasZ){
          p.shootTimer -= dt;
          if(p.shootTimer <= 0){
            p.shootTimer = 900;
            for(const z of zombies){
              if(z.row===y && !z.dead && !z.hypno && z.x > p.cx && z.x - p.cx < FUME_RANGE*CELL_W){
                damageZombie(z, 20);
                z.hitFlash = 80;
              }
            }
            fumeFx.push({ x: p.cx + 20, y: p.cy - 2, len: FUME_RANGE*CELL_W, life: 450, maxLife: 450, seed: rng()*100 });
            p.puffT = 260;
          }
        } else p.shootTimer = Math.min(p.shootTimer||0, 400);
      } else if(p.type === "scaredyshroom"){
        let near = false, hasZ = false;
        for(const z of zombies){
          if(z.row!==y || z.dead || z.hypno) continue;
          if(z.x > p.cx){
            hasZ = true;
            if(z.x - p.cx < CELL_W*1.6) near = true;
          }
        }
        p.hiding = near;
        if(hasZ && !near){
          p.shootTimer -= dt;
          if(p.shootTimer <= 0){
            p.shootTimer = PEA_INTERVAL;
            bullets.push({x:p.cx+14, y:p.cy-8, row:y, dmg:BULLET_DAMAGE, anim:now, spore:true});
          }
        } else p.shootTimer = Math.min(p.shootTimer||PEA_FIRST_DELAY, PEA_FIRST_DELAY);
      } else if(p.type === "gravebuster"){
        p.eatTimer -= dt;
        if(p.eatTimer <= 0){
          removeGrave(p.gx, p.gy);
          p.hp = 0;
          spawnParticle(p.cx, p.cy, "#5a8a4a", 10);
        }
      } else if(p.type === "iceshroom"){
        p.fuse -= dt;
        if(p.fuse <= 0){
          for(const z of zombies){
            if(!z.dead && !z.hypno){ z.frozen = ICE_SHROOM_FREEZE; z.slowed = ICE_SHROOM_FREEZE; }
          }
          spawnParticle(p.cx, p.cy, "#70d0f0", 24);
          p.hp = 0;
        }
      } else if(p.type === "doomshroom"){
        p.fuse -= dt;
        if(p.fuse <= 0){
          explode(p.cx, p.cy, DOOM_DAMAGE, y, DOOM_RANGE, "doom");
          /* 留下弹坑 */
          const cell = cellAt(p.cx, p.cy);
          if(cell && !craters.some(c => c.x===cell.x && c.y===cell.y)){
            craters.push({ x: cell.x, y: cell.y });
          }
          p.hp = 0;
        }
      }
    }
  }
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      if(grid[y][x] && grid[y][x].hp <= 0) grid[y][x] = null;
    }
  }

  /* 子弹更新 */
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x += BULLET_SPEED*dt/1000;
    b.anim = now;
    if(b.targetY !== undefined){
      const t = Math.min(1, (b.x - b.startX) / (CELL_W * 0.6));
      b.y = b.startY + (b.targetY - b.startY) * t;
    }
    if(b.maxX != null && b.x > b.maxX){ bullets.splice(i,1); continue; }
    if(b.x > SPAWN_X+20){ bullets.splice(i,1); continue; }
    for(const z of zombies){
      if(z.dead || z.hypno || z.row !== b.row) continue;
      if(Math.abs(z.x - b.x) < 16){
        damageZombie(z, b.dmg);
        z.hitFlash = 100;
        if(b.ice) z.slowed = 5000;
        bullets.splice(i,1);
        spawnParticle(b.x, b.y, z.helmet>0?((z.kind==="buckethead"||z.kind==="football"||z.kind==="screendoor")?"#aaa":(z.kind==="newspaper"?"#d8c8a0":"#e8822a")):(b.spore?"#c8a0e8":(b.ice?"#b0e8ff":"#a8e07a")), 4);
        break;
      }
    }
  }

  /* 最终大波：墓碑冒僵尸 */
  if(isNightLevel() && !graveSpawnDone && waveIndex > 0 && waveIndex === NUM_FLAGS*10){
    graveSpawnDone = true;
    for(const g of graves){
      const cy = GRID_Y + g.y*CELL_H + CELL_H/2 + 6;
      const c = cellCenter(g.x, g.y);
      const zt = ZOMBIE_TYPES.normal;
      zombies.push({
        x: c.x, y: cy, row:g.y, kind:"normal",
        hp: zt.hp, helmet:0, maxHelmet:0, speedMul: getDiff().speedMul,
        anim: now, walkT:0, attackT:0, dead:false,
        hasPole:false, jumping:false, jumpProgress:0, slowed:0, enraged:false, hypno:false, frozen:0
      });
    }
  }

  /* 僵尸更新 */
  for(let i=zombies.length-1;i>=0;i--){
    const z = zombies[i];
    if(z.dead){ zombies.splice(i,1); continue; }
    z.anim = now;
    if(z.hitFlash>0) z.hitFlash -= dt;
    if(z.frozen > 0){ z.frozen -= dt; continue; }

    /* 魅惑僵尸：向右走并撞击敌方僵尸 */
    if(z.hypno){
      z.x += ZOMBIE_SPEED * 1.2 * (z.speedMul||1) * dt/1000;
      for(const o of zombies){
        if(o===z || o.dead || o.hypno) continue;
        if(o.row===z.row && Math.abs(o.x-z.x)<22){
          damageZombie(o, 40); o.hitFlash=80;
          z.hp -= 30;
        }
      }
      if(z.x > SPAWN_X+40 || z.hp <= 0){
        z.dead = true;
        if(z.hp<=0 && !z._counted){ z._counted=true; killCount++; actionLog.push({t:now,e:"kill"}); }
      }
      continue;
    }

    /* 舞王召唤伴舞 */
    if(z.kind === "dancing"){
      z.danceTimer = (z.danceTimer==null ? 2500 : z.danceTimer) - dt;
      if(z.danceTimer <= 0){
        z.danceTimer = 9000;
        for(const dy of [-1,0,1]){
          const ry = z.row + dy;
          if(ry<0||ry>=ROWS) continue;
          if(dy===0 && rng()<0.4) continue;
          const zt = ZOMBIE_TYPES.backup;
          zombies.push({
            x: z.x + 20 + rng()*30, y: GRID_Y+ry*CELL_H+CELL_H/2+6, row:ry, kind:"backup",
            hp: Math.round(zt.hp*getDiff().hpMul), helmet:0, maxHelmet:0,
            speedMul: getDiff().speedMul, anim:now, walkT:0, attackT:0, dead:false,
            hasPole:false, jumping:false, jumpProgress:0, slowed:0, enraged:false, hypno:false, frozen:0
          });
        }
      }
    }

    /* 撑杆跳跳跃中 */
    if(z.jumping){
      z.jumpProgress += dt/600;
      z.x -= CELL_W*1.5*dt/600;
      if(z.jumpProgress >= 1){
        z.jumping = false;
        z.jumpProgress = 0;
        z.hasPole = false;
      }
      continue;
    }

    /* 检测前方植物 */
    let target = null;
    for(let x=0;x<COLS;x++){
      const p = grid[z.row][x];
      if(p && Math.abs(z.x - p.cx) < 28){ target = {p:p, x:x}; break; }
    }

    /* 撑杆跳僵尸有杆子时跳过第一个植物 */
    if(target && z.hasPole && z.kind === "polevaulter"){
      z.jumping = true;
      z.jumpProgress = 0;
      continue;
    }

    if(target){
      z.attackT -= dt;
      if(z.attackT <= 0){
        z.attackT = ZOMBIE_ATTACK_INTERVAL;
        if(target.p.type === "hypnoshroom"){
          z.hypno = true;
          z.helmet = 0;
          target.p.hp = 0;
          spawnParticle(z.x, z.y, "#d060c0", 12);
        } else {
          target.p.hp -= ZOMBIE_DAMAGE;
        }
      }
    } else {
      if(z.kind==="newspaper" && z.helmet<=0 && !z.enraged){ z.enraged = true; }
      let spd = ZOMBIE_SPEED;
      if(z.kind==="polevaulter" && z.hasPole) spd = ZOMBIE_SPEED*1.5;
      else if(ZOMBIE_TYPES[z.kind] && ZOMBIE_TYPES[z.kind].speed) spd = ZOMBIE_SPEED * ZOMBIE_TYPES[z.kind].speed;
      if(z.enraged) spd *= 2;
      if(z.slowed > 0){ z.slowed -= dt; spd *= 0.5; }
      spd *= (z.speedMul || 1);
      z.x -= spd*dt/1000;
      if(z.x < HOUSE_X){
        const my = z.row;
        if(mowers[my]){
          mowers[my] = false;
          mowerEntities.push({
            x: GRID_X - 30, cy: GRID_Y + my*CELL_H + CELL_H/2,
            row: my, anim: now
          });
        } else {
          lose();
          return;
        }
      }
    }
    if(z.hp <= 0){
      z.dead = true;
      if(!z._counted){
        z._counted = true;
        killCount++;
        spawnParticle(z.x, z.y, "#b5c098", 6);
        actionLog.push({t:now, e:"kill"});
      }
    }
  }

  /* 割草机行驶 */
  for(let i=mowerEntities.length-1;i>=0;i--){
    const m = mowerEntities[i];
    m.anim = now;
    m.x += MOWER_SPEED*dt/1000;
    for(const z of zombies){
      if(!z.dead && z.row===m.row && Math.abs(z.x - (m.x+11)) < 22){
        z.hp = 0; z.dead = true;
        if(!z._counted){ z._counted = true; killCount++; actionLog.push({t:now, e:"kill"}); }
        spawnParticle(z.x, z.y, "#b5c098", 6);
      }
    }
    if(rng() < 0.25){ spawnParticle(m.x+4, m.cy+6, "#7ec850", 1); }
    if(m.x > W + 30) mowerEntities.splice(i,1);
  }

  /* 粒子更新 */
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx*dt/1000; p.y += p.vy*dt/1000;
    p.vy += 200*dt/1000;
    p.life -= dt;
    if(p.life <= 0) particles.splice(i,1);
  }
  /* 爆炸特效寿命 */
  for(let i=boomFx.length-1;i>=0;i--){
    boomFx[i].life -= dt;
    if(boomFx[i].life <= 0) boomFx.splice(i,1);
  }
  for(let i=fumeFx.length-1;i>=0;i--){
    fumeFx[i].life -= dt;
    if(fumeFx[i].life <= 0) fumeFx.splice(i,1);
  }
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      const p = grid[y][x];
      if(p && p.puffT > 0) p.puffT -= dt;
    }
  }

  /* 胜利判定（无尽模式永不自动胜利） */
  if(!isEndless() && waveIndex >= NUM_FLAGS*10 && zombies.length === 0 && zombiesToSpawn.length === 0){
    win();
  }
}
let mowers = [true,true,true,true,true];

/* 对僵尸造成伤害：先扣防具，再扣本体 */
function damageZombie(z, dmg){
  if(z.helmet > 0){
    z.helmet -= dmg;
    if(z.helmet < 0){ z.hp += z.helmet; z.helmet = 0; }
  } else {
    z.hp -= dmg;
  }
  if(z.hp <= 0) z.dead = true;
}

function explode(cx, cy, dmg, row, range, kind){
  const r = range == null ? 1 : range;
  const k = kind || (r >= DOOM_RANGE ? "doom" : (r <= 1 ? "potato" : "cherry"));
  /* range：切比雪夫距离（格）。土豆≈0.6，樱桃≈1.5，毁灭≈5 */
  const cellRadius = r <= 1 ? 0.65 : (r <= 3 ? 1.5 : r * 0.85);
  boomFx.push({
    x: cx, y: cy, range: cellRadius, kind: k,
    life: k === "doom" ? 900 : 500,
    maxLife: k === "doom" ? 900 : 500
  });
  if(k === "doom"){
    spawnParticle(cx, cy, "#ff6a20", 36);
    spawnParticle(cx, cy, "#ffd24a", 28);
    spawnParticle(cx, cy, "#a020c0", 24);
    spawnParticle(cx, cy, "#2a1020", 18);
  } else {
    spawnParticle(cx, cy, "#ff8c42", 20);
    spawnParticle(cx, cy, "#ffd24a", 15);
  }
  for(const z of zombies){
    if(z.dead || z.hypno) continue;
    if(r <= 1){
      if(z.row === row && Math.abs(z.x - cx) < 55) damageZombie(z, dmg);
    } else {
      const dx = Math.abs(z.x - cx) / CELL_W;
      const dy = Math.abs(z.y - cy) / CELL_H;
      if(Math.max(dx, dy) <= cellRadius) damageZombie(z, dmg);
    }
  }
}
function spawnParticle(x,y,color,n){
  for(let i=0;i<n;i++){
    const a = rng()*Math.PI*2, sp = 40+rng()*120;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,color:color,size:2+rng()*4,life:400+rng()*300,maxLife:700});
  }
}
function drawBoomFx(fx){
  const t = 1 - fx.life / fx.maxLife;
  const alpha = 1 - t;
  const rw = CELL_W * fx.range * 2 * (0.85 + t * 0.35);
  const rh = CELL_H * fx.range * 2 * (0.85 + t * 0.35);
  ctx.save();
  if(fx.kind === "doom"){
    ctx.fillStyle = "rgba(255,220,160," + (0.35 * alpha) + ")";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(160,40,200," + (0.18 * alpha) + ")";
    ctx.beginPath();
    ctx.ellipse(fx.x, fx.y, rw * 0.55, rh * 0.55, 0, 0, 7);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,120,40," + (0.85 * alpha) + ")";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(fx.x, fx.y, rw/2, rh/2, 0, 0, 7);
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,220,80," + (0.55 * alpha) + ")";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(fx.x, fx.y, rw * 0.35 * (1 + t), rh * 0.35 * (1 + t), 0, 0, 7);
    ctx.stroke();
    /* 蘑菇云感 */
    ctx.fillStyle = "rgba(40,20,50," + (0.45 * alpha) + ")";
    ctx.beginPath(); ctx.ellipse(fx.x, fx.y - 20 - t * 30, 28 + t * 20, 22 + t * 16, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(220,80,40," + (0.5 * alpha) + ")";
    ctx.beginPath(); ctx.ellipse(fx.x, fx.y - 10 - t * 18, 18 + t * 10, 14 + t * 8, 0, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = "rgba(255,120,40," + (0.22 * alpha) + ")";
    ctx.beginPath();
    ctx.ellipse(fx.x, fx.y, rw/2, rh/2, 0, 0, 7);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,200,80," + (0.7 * alpha) + ")";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(fx.x, fx.y, rw/2, rh/2, 0, 0, 7);
    ctx.stroke();
  }
  ctx.restore();
}
function drawFumeFx(fx){
  const t = 1 - fx.life / fx.maxLife;
  const alpha = t < 0.2 ? t / 0.2 : 1 - (t - 0.2) / 0.8;
  const reach = fx.len * Math.min(1, t * 2.2);
  ctx.save();
  const g = ctx.createLinearGradient(fx.x, 0, fx.x + fx.len, 0);
  g.addColorStop(0, "rgba(170,110,220," + (0.55 * alpha) + ")");
  g.addColorStop(0.6, "rgba(190,140,235," + (0.35 * alpha) + ")");
  g.addColorStop(1, "rgba(210,170,245,0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(fx.x, fx.y - 7);
  ctx.quadraticCurveTo(fx.x + reach * 0.5, fx.y - 22, fx.x + reach, fx.y - 16);
  ctx.lineTo(fx.x + reach, fx.y + 16);
  ctx.quadraticCurveTo(fx.x + reach * 0.5, fx.y + 22, fx.x, fx.y + 7);
  ctx.closePath();
  ctx.fill();
  for(let i=0;i<9;i++){
    const f = (i + 0.5) / 9;
    if(f * fx.len > reach) break;
    const px = fx.x + f * fx.len;
    const py = fx.y + Math.sin(fx.seed + i * 1.7 + t * 6) * 9;
    const r = 6 + f * 9 + t * 5;
    ctx.fillStyle = "rgba(200,155,240," + (0.4 * alpha * (1 - f * 0.5)) + ")";
    ctx.beginPath(); ctx.arc(px, py, r, 0, 7); ctx.fill();
  }
  ctx.restore();
}
function drawCraters(){
  for(const c of craters){
    const x = GRID_X + c.x * CELL_W + CELL_W/2;
    const y = GRID_Y + c.y * CELL_H + CELL_H/2 + 8;
    ctx.fillStyle = "rgba(20,12,10,.55)";
    ctx.beginPath(); ctx.ellipse(x, y, 26, 14, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(50,30,20,.45)";
    ctx.beginPath(); ctx.ellipse(x, y+2, 18, 8, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(80,50,30,.5)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(x, y, 26, 14, 0, 0, 7); ctx.stroke();
  }
}
function hasCrater(cx, cy){
  return craters.some(c => c.x === cx && c.y === cy);
}

/* ===== 渲染 ===== */
function getWorldBtns(){
  const items = [{id:"day", label:"☀ 白天"}, {id:"night", label:"🌙 黑夜"}];
  const bw = 120, bh = 32, gap = 14;
  const total = items.length*bw + (items.length-1)*gap;
  const x0 = W/2 - total/2, y = 102;
  return items.map((it,i)=>({ ...it, x:x0+i*(bw+gap), y, w:bw, h:bh }));
}
function getDiffBtns(){
  const bw = 90, bh = 30, gap = 10;
  const total = DIFF_ORDER.length*bw + (DIFF_ORDER.length-1)*gap;
  const x0 = W/2 - total/2, y = 148;
  return DIFF_ORDER.map((id,i)=>({ id, x:x0+i*(bw+gap), y, w:bw, h:bh }));
}
function getLevelBtns(){
  const list = getWorldLevels();
  const cols = 5, bw = 100, bh = 48, gapX = 10, gapY = 8;
  const totalW = cols*bw + (cols-1)*gapX;
  const x0 = W/2 - totalW/2, y0 = 200;
  return list.map((lv,i)=>{
    const col = i % cols, row = Math.floor(i / cols);
    return { id:lv.id, lv, x:x0+col*(bw+gapX), y:y0+row*(bh+gapY), w:bw, h:bh };
  });
}
const ENDLESS_BTN = { w:200, h:44, get x(){return W/2-210;}, get y(){return 318;} };
const WEEKLY_BTN  = { w:200, h:44, get x(){return W/2+10;}, get y(){return 318;} };
const LB_BTN      = { w:220, h:38, get x(){return W/2-this.w/2;}, get y(){return 378;} };
const BACK_BTN    = { w:120, h:42, get x(){return W/2-this.w/2;}, get y(){return H-60;} };
const PAUSE_BTN   = { w:40, h:36, x: W-176, y: 10 };
const PAUSE_PANEL = { w:320, h:210, get x(){return W/2-this.w/2;}, get y(){return H/2-this.h/2;} };
const RESUME_BTN  = { w:240, h:52, get x(){return W/2-this.w/2;}, get y(){return PAUSE_PANEL.y+74;} };
const PMENU_BTN   = { w:240, h:52, get x(){return W/2-this.w/2;}, get y(){return RESUME_BTN.y+RESUME_BTN.h+18;} };

function drawMenuBtn(b, label, colors, sub, now){
  const hover = mouse.x>=b.x && mouse.x<=b.x+b.w && mouse.y>=b.y && mouse.y<=b.y+b.h;
  ctx.save();
  if(hover) ctx.translate(0, -2);
  const g = ctx.createLinearGradient(0, b.y, 0, b.y+b.h);
  g.addColorStop(0, hover ? colors[2] : colors[0]);
  g.addColorStop(1, hover ? colors[3] : colors[1]);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 14); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(b.x+2, b.y+2, b.w-4, b.h-4, 12); ctx.stroke();
  ctx.fillStyle = "#fff";
  ctx.font = "bold " + (sub ? 18 : 20) + "px sans-serif"; ctx.textAlign = "center";
  ctx.fillText(label, b.x+b.w/2, b.y + (sub ? b.h/2-2 : b.h/2+7));
  if(sub){
    ctx.font = "11px sans-serif"; ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.fillText(sub, b.x+b.w/2, b.y+b.h-10);
  }
  ctx.restore();
}

function drawMenu(now){
  ctx.clearRect(0,0,W,H);
  drawBackground();
  const veil = ctx.createLinearGradient(0,0,0,H);
  veil.addColorStop(0,"rgba(40,28,16,.62)");
  veil.addColorStop(1,"rgba(30,40,18,.55)");
  ctx.fillStyle = veil;
  ctx.fillRect(0,0,W,H);
  for(let i=0;i<4;i++){
    const sx = 120 + i*220 + Math.sin(now*0.0008+i)*24;
    const sy = 70 + Math.cos(now*0.0006+i*2)*18;
    ctx.save(); ctx.globalAlpha = 0.35;
    drawSun({x:sx, y:sy, anim:now+i*1000});
    ctx.restore();
  }
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(0,0,0,.35)";
  ctx.font = "bold 42px sans-serif";
  ctx.fillText("植物大战僵尸", W/2+2, 72);
  ctx.fillStyle = "#fff";
  ctx.fillText("植物大战僵尸", W/2, 70);
  ctx.font = "bold 15px sans-serif";
  ctx.fillStyle = "#ffd24a";
  ctx.fillText(curWorld==="night" ? "黑夜冒险 2-1～2-10" : "白天冒险 1-1～1-10", W/2, 92);

  getWorldBtns().forEach(b=>{
    const active = curWorld === b.id;
    const hover = mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h;
    ctx.fillStyle = active ? (b.id==="night"?"#5a3a88":"#5aa530") : (hover?"rgba(255,255,255,.28)":"rgba(255,255,255,.12)");
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 16); ctx.fill();
    ctx.strokeStyle = active ? "#fff" : "rgba(255,255,255,.35)";
    ctx.lineWidth = active ? 2 : 1;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 16); ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(b.label, b.x+b.w/2, b.y+b.h/2+5);
  });

  ctx.fillStyle = "rgba(255,255,255,.65)";
  ctx.font = "12px sans-serif";
  ctx.fillText("难度", W/2, 140);
  getDiffBtns().forEach(b=>{
    const d = DIFFICULTIES[b.id];
    const active = curDiff === b.id;
    const hover = mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h;
    ctx.fillStyle = active ? d.color : (hover ? "rgba(255,255,255,.28)" : "rgba(255,255,255,.14)");
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 16); ctx.fill();
    ctx.strokeStyle = active ? "#fff" : "rgba(255,255,255,.4)";
    ctx.lineWidth = active ? 2 : 1;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 16); ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(d.name, b.x+b.w/2, b.y+b.h/2+5);
  });

  ctx.fillStyle = "rgba(255,255,255,.65)";
  ctx.font = "12px sans-serif";
  ctx.fillText("选择关卡", W/2, 190);
  getLevelBtns().forEach(b=>{
    const hover = mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h;
    ctx.save();
    if(hover) ctx.translate(0,-2);
    const g = ctx.createLinearGradient(0, b.y, 0, b.y+b.h);
    const last = b.id === (curWorld==="night"?CLEAR_NIGHT_ID:CLEAR_DAY_ID);
    if(last){ g.addColorStop(0,"#e8822a"); g.addColorStop(1,"#c04820"); }
    else if(curWorld==="night"){ g.addColorStop(0, hover?"#9a70d0":"#6a48a0"); g.addColorStop(1, hover?"#7a50b0":"#4a3080"); }
    else if(b.id >= 5){ g.addColorStop(0, hover?"#9ed060":"#6cb840"); g.addColorStop(1, hover?"#5aa530":"#3a8a20"); }
    else { g.addColorStop(0, hover?"#9ee070":"#7ec850"); g.addColorStop(1, hover?"#6cb840":"#4a9a2c"); }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 10); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(b.x+1, b.y+1, b.w-2, b.h-2, 9); ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(b.lv.title.replace(/^(白天|黑夜) /,""), b.x+b.w/2, b.y+20);
    ctx.font = "10px sans-serif"; ctx.fillStyle = "rgba(255,255,255,.88)";
    ctx.fillText(b.lv.sub, b.x+b.w/2, b.y+38);
    ctx.restore();
  });

  drawMenuBtn(ENDLESS_BTN, "∞ 无尽模式", ["#e07040","#c04020","#f09060","#e0584c"],
    bestEndlessWave>0 ? ("最佳 "+bestEndlessWave+" 波") : "波次无限升级", now);
  drawMenuBtn(WEEKLY_BTN, "⚔ 每周挑战", ["#8a5ec8","#5a3a98","#b07ce8","#7a4ec0"],
    window.__WEEK__ ? ("本周 "+window.__WEEK__.id) : "阵容每周轮换", now);
  drawMenuBtn(LB_BTN, "🏆 通关排行榜", ["rgba(255,255,255,.18)","rgba(255,255,255,.1)","rgba(255,255,255,.3)","rgba(255,255,255,.18)"], null, now);

  ctx.fillStyle = "rgba(255,255,255,.55)";
  ctx.font = "12px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("当前：" + (curWorld==="night"?"黑夜":"白天") + " · " + getDiff().name + " · 通关终章记入排行榜", W/2, 432);
}

/* 排行榜面板 */
function drawPickCard(key, x, y, w, h, opts){
  const def = PLANTS[key];
  const taken = !!(opts && opts.taken);
  const hover = !!(opts && opts.hover);
  const slot = !!(opts && opts.slot);
  ctx.save();
  ctx.fillStyle = taken ? "rgba(40,50,42,.45)" : (hover ? "rgba(255,248,220,.96)" : "rgba(250,242,220,.94)");
  ctx.strokeStyle = hover ? "#e8892c" : (slot ? "rgba(255,255,255,.28)" : "#c9a878");
  ctx.lineWidth = hover ? 2.5 : 1.5;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.fill(); ctx.stroke();
  if(def){
    ctx.save();
    ctx.translate(x + w/2, y + h * 0.38);
    const sc = Math.min(0.58, w/100);
    ctx.scale(sc, sc);
    drawPlantIcon(key, performance.now(), 0);
    ctx.restore();
    ctx.fillStyle = taken ? "rgba(90,80,70,.45)" : "#5a4a3a";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(def.name, x + w/2, y + h - 22);
    ctx.fillStyle = taken ? "rgba(160,80,60,.5)" : "#8b5a2b";
    ctx.font = "bold 12px sans-serif";
    ctx.fillText(String(def.cost), x + w/2, y + h - 8);
  } else if(slot){
    ctx.fillStyle = "rgba(255,255,255,.2)";
    ctx.font = "24px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("+", x + w/2, y + h/2 + 8);
  }
  if(taken){
    ctx.fillStyle = "rgba(20,30,22,.35)";
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.fill();
  }
  ctx.restore();
}
function drawPick(now){
  ctx.clearRect(0,0,W,H);
  drawBackground();
  ctx.fillStyle = "rgba(8,14,12,.62)";
  ctx.fillRect(0,0,W,H);
  const L = getPickLayout();
  ctx.textAlign = "center";
  ctx.fillStyle = "#fff";
  ctx.font = "bold 28px sans-serif";
  ctx.fillText("选择你的植物", W/2, 34);
  ctx.fillStyle = "rgba(247,241,227,.7)";
  ctx.font = "13px sans-serif";
  ctx.fillText("可选 " + MAX_SEED_SLOTS + " 张 · 已选 " + pickSelected.length + " / " + plantPool.length, W/2, 52);

  for(let i=0;i<MAX_SEED_SLOTS;i++){
    const x = L.bankX + i*(L.slotW + L.slotGap);
    const key = pickSelected[i];
    const hover = mouse.x>=x && mouse.x<=x+L.slotW && mouse.y>=L.bankY && mouse.y<=L.bankY+L.slotH;
    if(key) drawPickCard(key, x, L.bankY, L.slotW, L.slotH, { hover: hover, slot: true });
    else {
      ctx.fillStyle = "rgba(255,255,255,.08)";
      ctx.strokeStyle = "rgba(255,255,255,.22)";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.roundRect(x, L.bankY, L.slotW, L.slotH, 12); ctx.fill(); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "rgba(255,255,255,.35)";
      ctx.font = "20px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(String(i+1), x+L.slotW/2, L.bankY+L.slotH/2+7);
    }
  }

  ctx.fillStyle = "rgba(247,241,227,.65)";
  ctx.font = "13px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("点击下方植物加入卡槽，再点卡槽可卸下", W/2, L.poolY - 14);

  plantPool.forEach((key, i)=>{
    const col = i % L.poolCols;
    const row = Math.floor(i / L.poolCols);
    const x = L.poolX + col * (L.poolCardW + L.poolGapX);
    const y = L.poolY + row * (L.poolCardH + L.poolGapY);
    const taken = pickSelected.indexOf(key) >= 0;
    const hover = !taken && mouse.x>=x && mouse.x<=x+L.poolCardW && mouse.y>=y && mouse.y<=y+L.poolCardH;
    drawPickCard(key, x, y, L.poolCardW, L.poolCardH, { taken, hover });
  });

  const sb = L.startBtn;
  const canStart = pickSelected.length > 0;
  const sh = canStart && mouse.x>=sb.x && mouse.x<=sb.x+sb.w && mouse.y>=sb.y && mouse.y<=sb.y+sb.h;
  const sg = ctx.createLinearGradient(sb.x, sb.y, sb.x, sb.y+sb.h);
  if(canStart){
    sg.addColorStop(0, sh ? "#f0b04a" : "#f0a33a");
    sg.addColorStop(1, sh ? "#e87a28" : "#e06a1a");
  } else {
    sg.addColorStop(0, "#6a6a6a"); sg.addColorStop(1, "#555");
  }
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.roundRect(sb.x, sb.y, sb.w, sb.h, 24); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.font = "bold 18px sans-serif"; ctx.textAlign = "center";
  ctx.fillText(canStart ? ("开始战斗 · " + pickSelected.length + " 张") : "请先选择植物", sb.x+sb.w/2, sb.y+sb.h/2+6);

  const bb = L.backBtn;
  const bh = mouse.x>=bb.x && mouse.x<=bb.x+bb.w && mouse.y>=bb.y && mouse.y<=bb.y+bb.h;
  ctx.fillStyle = bh ? "rgba(255,255,255,.2)" : "rgba(255,255,255,.1)";
  ctx.strokeStyle = "rgba(255,255,255,.28)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(bb.x, bb.y, bb.w, bb.h, 20); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#fff";
  ctx.font = "bold 14px sans-serif";
  ctx.fillText("返回", bb.x+bb.w/2, bb.y+bb.h/2+5);
}
function render(now){
  if(state === "menu" || state === "leaderboard"){ return; }
  if(state === "pick"){ drawPick(now); return; }
  ctx.clearRect(0,0,W,H);
  drawBackground();
  if(selected && mouse.x>0){
    const cell = cellAt(mouse.x, mouse.y);
    if(cell){
      const c = cellCenter(cell.x, cell.y);
      const badGrave = (selected==="gravebuster") ? !hasGrave(cell.x,cell.y) : hasGrave(cell.x,cell.y);
      const badCrater = selected!=="gravebuster" && hasCrater(cell.x, cell.y);
      ctx.fillStyle = (grid[cell.y][cell.x] || sun < PLANTS[selected].cost || badGrave || badCrater) ? "rgba(200,60,60,.25)" : "rgba(255,255,200,.35)";
      ctx.fillRect(GRID_X+cell.x*CELL_W, GRID_Y+cell.y*CELL_H, CELL_W, CELL_H);
      ctx.strokeStyle = "rgba(90,140,50,.6)"; ctx.lineWidth = 2;
      ctx.strokeRect(GRID_X+cell.x*CELL_W+1, GRID_Y+cell.y*CELL_H+1, CELL_W-2, CELL_H-2);
    }
  }
  if(shovelActive && mouse.x>0){
    const cell = cellAt(mouse.x, mouse.y);
    if(cell && grid[cell.y][cell.x]){
      ctx.fillStyle = "rgba(200,140,40,.3)";
      ctx.fillRect(GRID_X+cell.x*CELL_W, GRID_Y+cell.y*CELL_H, CELL_W, CELL_H);
    }
  }
  drawCraters();
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      const p = grid[y][x];
      if(p) drawPlant(p, p.cx, p.cy);
    }
  }
  for(const s of suns) drawSun(s);
  for(const b of bullets) drawBullet(b);
  for(const z of zombies){ if(z.hitFlash>0){ ctx.globalAlpha=0.6; } drawZombie(z); ctx.globalAlpha=1; }
  for(const m of mowerEntities) drawMowerBody(m.x, m.cy);
  for(const fx of fumeFx) drawFumeFx(fx);
  for(const fx of boomFx) drawBoomFx(fx);
  for(const p of particles) drawParticle(p);
  drawUI(now);
  /* 暂停面板 */
  if(paused){
    ctx.fillStyle = "rgba(20,15,10,.55)";
    ctx.fillRect(0,0,W,H);
    const pp = PAUSE_PANEL;
    ctx.fillStyle = "#fef3e2";
    ctx.strokeStyle = "#8b5a2b"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(pp.x, pp.y, pp.w, pp.h, 16); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#8b5a2b";
    ctx.font = "bold 30px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("已暂停", W/2, pp.y+48);
    const pbtns = [[RESUME_BTN,"▶ 继续游戏","#7ec850","#5aa530"],[PMENU_BTN,"🏠 返回主菜单","#e0a030","#c08020"]];
    for(const it of pbtns){
      const bb = it[0];
      const hover = mouse.x>=bb.x&&mouse.x<=bb.x+bb.w&&mouse.y>=bb.y&&mouse.y<=bb.y+bb.h;
      ctx.save();
      if(hover) ctx.translate(0,-2);
      const g = ctx.createLinearGradient(0,bb.y,0,bb.y+bb.h);
      g.addColorStop(0, hover?"#9ee070":it[1+1]); g.addColorStop(1, hover?"#7ec850":it[1+2]);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.roundRect(bb.x, bb.y, bb.w, bb.h, 12); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "bold 20px sans-serif";
      ctx.fillText(it[1], bb.x+bb.w/2, bb.y+bb.h/2+7);
      ctx.restore();
    }
  }
}

/* ===== 输入 ===== */
function getMouse(e){
  const r = C.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (W / r.width),
    y: (e.clientY - r.top) * (H / r.height)
  };
}
C.addEventListener("mousemove", e=>{ const m=getMouse(e); mouse.x=m.x; mouse.y=m.y; });
C.addEventListener("mouseleave", ()=>{ mouse.x=-1; mouse.y=-1; });
C.addEventListener("click", e=>{
  const m = getMouse(e); mouse.x=m.x; mouse.y=m.y;
  /* 暂停面板：继续 / 返回主菜单 */
  if(paused){
    const rb = RESUME_BTN;
    if(m.x>=rb.x&&m.x<=rb.x+rb.w&&m.y>=rb.y&&m.y<=rb.y+rb.h){ paused=false; return; }
    const mb = PMENU_BTN;
    if(m.x>=mb.x&&m.x<=mb.x+mb.w&&m.y>=mb.y&&m.y<=mb.y+mb.h){ paused=false; showLanding(); return; }
    return;
  }
  if(state === "menu" || state === "leaderboard") return;
  if(state === "pick"){
    const L = getPickLayout();
    const bb = L.backBtn;
    if(m.x>=bb.x && m.x<=bb.x+bb.w && m.y>=bb.y && m.y<=bb.y+bb.h){
      showLanding();
      return;
    }
    const sb = L.startBtn;
    if(m.x>=sb.x && m.x<=sb.x+sb.w && m.y>=sb.y && m.y<=sb.y+sb.h){
      confirmPickAndStart();
      return;
    }
    for(let i=0;i<pickSelected.length;i++){
      const x = L.bankX + i*(L.slotW + L.slotGap);
      if(m.x>=x && m.x<=x+L.slotW && m.y>=L.bankY && m.y<=L.bankY+L.slotH){
        pickSelected.splice(i, 1);
        return;
      }
    }
    for(let i=0;i<plantPool.length;i++){
      const col = i % L.poolCols;
      const row = Math.floor(i / L.poolCols);
      const x = L.poolX + col * (L.poolCardW + L.poolGapX);
      const y = L.poolY + row * (L.poolCardH + L.poolGapY);
      if(m.x>=x && m.x<=x+L.poolCardW && m.y>=y && m.y<=y+L.poolCardH){
        const key = plantPool[i];
        if(pickSelected.indexOf(key) >= 0) return;
        if(pickSelected.length >= MAX_SEED_SLOTS) return;
        pickSelected.push(key);
        return;
      }
    }
    return;
  }
  if(state !== "play") return;
  /* 右上角暂停按钮 */
  {
    const pb = PAUSE_BTN;
    if(m.x>=pb.x&&m.x<=pb.x+pb.w&&m.y>=pb.y&&m.y<=pb.y+pb.h){ paused=true; return; }
  }
  if(m.x >= W-130 && m.x <= W-16 && m.y >= 10 && m.y <= 46){
    sunClickCount++;
    if(sunClickCount >= 3){
      cheatInput.style.display = "block";
      cheatInput.focus();
      sunClickCount = 0;
    }
    return;
  }
  let collectedAny = false;
  for(let i=suns.length-1;i>=0;i--){
    const s = suns[i];
    if(!s.flying && Math.hypot(s.x-m.x, s.y-m.y) < 28){
      s.flying = true;
      s.flyT = 0;
      s.flyDur = 300 + Math.hypot(s.x-SUN_BOX_X, s.y-SUN_BOX_Y)*0.4;
      s.fromX = s.x; s.fromY = s.y;
      s.toX = SUN_BOX_X; s.toY = SUN_BOX_Y;
      s.falling = false;
      spawnParticle(s.x, s.y, "#ffd24a", 6);
      collectedAny = true;
    }
  }
  if(collectedAny) return;
  {
    const { cardX0, cardY, cardW, cardH, gap } = getCardLayout();
    if(m.x >= cardX0 && m.y >= cardY && m.y <= cardY+cardH){
      curCardOrder.forEach((key, i)=>{
        const x = cardX0 + i*(cardW+gap);
        if(m.x >= x && m.x <= x+cardW){
          if(cardCd[key] > performance.now() || sun < PLANTS[key].cost) return;
          selected = (selected===key) ? null : key;
          shovelActive = false;
        }
      });
      const shX = cardX0 + curCardOrder.length*(cardW+gap) + 6;
      if(m.x >= shX && m.x <= shX+44){
        shovelActive = !shovelActive;
        selected = null;
      }
      return;
    }
  }
  const cell = cellAt(m.x, m.y);
  if(cell){
    if(shovelActive){
      if(grid[cell.y][cell.x]){
        grid[cell.y][cell.x] = null;
        shovelActive = false;
        actionLog.push({t:performance.now(), e:"shovel", x:cell.x, y:cell.y});
      }
    } else if(selected){
      const onGrave = hasGrave(cell.x, cell.y);
      if(selected === "gravebuster"){
        if(!onGrave || grid[cell.y][cell.x] || sun < PLANTS.gravebuster.cost || cardCd.gravebuster > performance.now()) return;
        const c = cellCenter(cell.x, cell.y);
        const p = { type:"gravebuster", cx:c.x, cy:c.y+4, hp:PLANTS.gravebuster.hp, anim:performance.now(), eatTimer:4000, gx:cell.x, gy:cell.y };
        grid[cell.y][cell.x] = p;
        sun -= PLANTS.gravebuster.cost;
        cardCd.gravebuster = performance.now() + PLANTS.gravebuster.cd;
        actionLog.push({t:performance.now(), e:"plant", type:"gravebuster", x:cell.x, y:cell.y});
        selected = null;
        spawnParticle(c.x, c.y+10, "#5a8a4a", 6);
        return;
      }
      if(onGrave) return; // 墓碑上不能种普通植物
      if(hasCrater(cell.x, cell.y)) return; // 毁灭菇弹坑不能再种
      if(!grid[cell.y][cell.x] && sun >= PLANTS[selected].cost && cardCd[selected] <= performance.now()){
        const c = cellCenter(cell.x, cell.y);
        const def = PLANTS[selected];
        const p = { type:selected, cx:c.x, cy:c.y+4, hp:def.hp, anim:performance.now() };
        if(selected==="peashooter" || selected==="repeaterpea" || selected==="snowpea" || selected==="threepeater" || selected==="puffshroom" || selected==="fumeshroom" || selected==="scaredyshroom") p.shootTimer = PEA_FIRST_DELAY;
        if(selected==="repeaterpea") p.secondShotT = 0;
        if(selected==="chomper"){ p.chewing=false; p.chewTimer=0; }
        if(selected==="sunflower") p.sunTimer = SUNFLOWER_FIRST;
        if(selected==="sunshroom"){ p.sunTimer = SUNFLOWER_FIRST; p.grown=false; p.growTimer=SUNSHROOM_GROW; }
        if(selected==="potatomine"){ p.armed=false; p.armTimer=POTATO_ARM_TIME; }
        if(selected==="cherrybomb" || selected==="iceshroom" || selected==="doomshroom") p.fuse = CHERRY_FUSE;
        grid[cell.y][cell.x] = p;
        sun -= def.cost;
        cardCd[selected] = performance.now() + def.cd;
        actionLog.push({t:performance.now(), e:"plant", type:selected, x:cell.x, y:cell.y});
        selected = null;
        spawnParticle(c.x, c.y+10, "#7ec850", 6);
      }
    }
  }
});

/* ===== 胜负 ===== */
function win(){
  state = "won";
  paused = false;
  ovTitle.textContent = "通关成功！";
  const dname = getDiff().name;
  if(gameMode === "weekly"){
    ovText.textContent = "本周挑战通关！收集阳光 " + collectedSun + " 已记入周榜，多打多累积！";
  } else if(hasNextLevel()){
    const nxt = nextLevelTarget();
    ovText.textContent = curLevelMeta.title + "（" + dname + "）通关！可以进入 " + nxt.title + "。";
  } else {
    ovText.textContent = curLevelMeta.title + "（" + dname + "）通关！击杀 " + killCount + " 只僵尸。";
  }
  setOverlayActions("win");
  fillLeaderboardHTML();
  overlay.classList.add("show");
  if(window.community && window.community.call){
    window.community.call("finish", {seed:gameSeed, actions:actionLog, result:"win", level:curLevel, world:curWorld, mode:gameMode, difficulty:curDiff, collectedSun:collectedSun, week:(window.__WEEK__&&window.__WEEK__.id)});
  }
}
function lose(){
  state = "lost";
  paused = false;
  if(isEndless()){
    if(waveIndex > bestEndlessWave){
      bestEndlessWave = waveIndex;
      try { localStorage.setItem("pvz_endless_best", String(bestEndlessWave)); } catch(e){}
    }
    ovTitle.textContent = "无尽结束";
    ovText.textContent = "撑到第 " + waveIndex + " 波，击杀 " + killCount + " 只！历史最佳 " + bestEndlessWave + " 波。";
    setOverlayActions("endless");
  } else {
    ovTitle.textContent = "游戏失败";
    ovText.textContent = "僵尸吃掉了你的脑子！（" + getDiff().name + " · " + curLevelMeta.title + "）";
    setOverlayActions("lose");
  }
  fillLeaderboardHTML();
  overlay.classList.add("show");
  if(window.community && window.community.call){
    window.community.call("finish", {seed:gameSeed, actions:actionLog, result:"lose", level:curLevel, mode:gameMode, difficulty:curDiff, collectedSun:collectedSun, waves:waveIndex, kills:killCount, week:(window.__WEEK__&&window.__WEEK__.id)});
  }
}
ovNextBtn.addEventListener("click", ()=>{
  if(state === "won" && hasNextLevel()){
    const nxt = nextLevelTarget();
    newGame(window.__SEED__, nxt.id, gameMode, nxt.world);
  }
});
ovBtn.addEventListener("click", ()=>{
  newGame(window.__SEED__, isEndless() ? 0 : curLevel, gameMode, curWorld);
});
ovMenuBtn.addEventListener("click", ()=>{
  overlay.classList.remove("show");
  ovNextBtn.style.display = "none";
  paused = false;
  showLanding();
});
/* 作弊：在随机一路召唤指定类型僵尸 */
function spawnCheatZombie(kind){
  if(state !== "play") return;
  const row = Math.floor(rng()*ROWS);
  const cy = GRID_Y + row*CELL_H + CELL_H/2 + 6;
  const zt = ZOMBIE_TYPES[kind] || ZOMBIE_TYPES.normal;
  zombies.push({
    x: SPAWN_X + rng()*30, y: cy, row:row, kind:kind,
    hp: zt.hp, helmet: zt.helmet, maxHelmet: zt.helmet,
    anim: performance.now(), walkT:0, attackT:0, attackTarget:null, dead:false,
    hasPole: false, jumping:false, jumpProgress:0,
    slowed: 0, enraged: false
  });
}
cheatInput.addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    if(cheatInput.value === "zard666"){
      cheatInput.value = "";
      cheatInput.style.display = "none";
      win();
    } else if(cheatInput.value === "zard999"){
      sun = 999;
      cheatInput.value = "";
      cheatInput.style.display = "none";
    } else if(cheatInput.value === "zarddb"){
      spawnCheatZombie("newspaper");
      cheatInput.value = ""; cheatInput.style.display = "none";
    } else if(cheatInput.value === "zardglq"){
      spawnCheatZombie("football");
      cheatInput.value = ""; cheatInput.style.display = "none";
    } else if(cheatInput.value === "zardtw"){
      spawnCheatZombie("screendoor");
      cheatInput.value = ""; cheatInput.style.display = "none";
    } else {
      cheatInput.style.display = "none";
      cheatInput.value = "";
    }
  }
  if(e.key === "Escape"){
    cheatInput.style.display = "none";
    cheatInput.value = "";
  }
  e.stopPropagation();
});
cheatInput.addEventListener("blur", ()=>{
  cheatInput.style.display = "none";
  cheatInput.value = "";
});

/* ===== 主循环 ===== */
function loop(t){
  if(!lastTime) lastTime = t;
  const dt = Math.min(t - lastTime, 50);
  lastTime = t;
  update(dt, t);
  render(t);
  requestAnimationFrame(loop);
}

/* polyfill: roundRect */
if(!ctx.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if(typeof r==="number") r={tl:r,tr:r,br:r,bl:r};
    this.beginPath();
    this.moveTo(x+r.tl,y);
    this.lineTo(x+w-r.tr,y); this.quadraticCurveTo(x+w,y,x+w,y+r.tr);
    this.lineTo(x+w,y+h-r.br); this.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h);
    this.lineTo(x+r.bl,y+h); this.quadraticCurveTo(x,y+h,x,y+h-r.bl);
    this.lineTo(x,y+r.tl); this.quadraticCurveTo(x,y,x+r.tl,y);
    this.closePath();
    return this;
  };
}

state = "menu";
mouse = {x:-1, y:-1, click:false};
/* 本地预览 fallback：服务端未注入 __WEEK__ 时，按当前日期生成（服务端注入会覆盖） */

}
if(!window.__WEEK_LEADERBOARD__) window.__WEEK_LEADERBOARD__ = [];
mowers = [true,true,true,true,true];
mowerEntities = [];
bindLandingUI();
showLanding();
/* 快捷键：ESC / P 切换暂停（输入框聚焦时不触发） */
window.addEventListener("keydown", e=>{
  if(document.activeElement && document.activeElement.tagName === "INPUT") return;
  if(state === "play" && (e.key === "Escape" || e.key === "p" || e.key === "P")){
    paused = !paused;
    e.preventDefault();
  }
});
requestAnimationFrame(loop);
