<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>植物大战僵尸 · 庭院防线</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #142016;
  --moss: #2f6b3a;
  --leaf: #5dae4a;
  --sun: #f2b84a;
  --amber: #e8892c;
  --cream: #f7f1e3;
  --night: #0b1520;
  --moon: #d9e7f2;
  --mist: rgba(255,255,255,.08);
  --ease: cubic-bezier(.22,1,.36,1);
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { min-height:100%; }
body {
  font-family: "Noto Sans SC", "PingFang SC", sans-serif;
  color: var(--cream);
  background: #08110c;
  overflow-x: hidden;
}
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
.hidden { display: none !important; }

/* ===== Landing ===== */
#landing {
  position: relative; min-height: 100vh;
  display: flex; flex-direction: column;
  isolation: isolate;
}
#landing::before {
  content:""; position:fixed; inset:0; z-index:-2;
  background:
    linear-gradient(105deg, rgba(18,42,22,.55) 0%, rgba(8,16,24,.35) 48%, rgba(8,14,28,.72) 100%),
    var(--hero-bg, url("assets/hero-bg.jpg")) center/cover no-repeat;
  transform: scale(1.04);
  animation: heroDrift 18s ease-in-out infinite alternate;
}
#landing::after {
  content:""; position:fixed; inset:0; z-index:-1;
  background:
    radial-gradient(ellipse 50% 40% at 15% 20%, rgba(255,200,90,.18), transparent 55%),
    radial-gradient(ellipse 45% 50% at 85% 70%, rgba(80,140,180,.16), transparent 50%),
    linear-gradient(to top, rgba(5,10,8,.78), transparent 42%);
  pointer-events: none;
}
@keyframes heroDrift { from { transform: scale(1.04) translateY(0); } to { transform: scale(1.08) translateY(-1.5%); } }

.landing-nav {
  display:flex; justify-content:space-between; align-items:center;
  padding: 22px clamp(20px,4vw,56px); position: relative; z-index: 2;
}
.brand-mark {
  font-family: "ZCOOL QingKe HuangYou", "Fredoka", sans-serif;
  font-size: 1.15rem; letter-spacing: .08em; color: #fff;
  text-shadow: 0 2px 16px rgba(0,0,0,.35);
}
.nav-actions { display:flex; gap:10px; }
.chip {
  padding: 10px 16px; border-radius: 999px;
  border: 1px solid rgba(255,255,255,.22);
  background: rgba(255,255,255,.08);
  backdrop-filter: blur(10px);
  transition: transform .25s var(--ease), background .25s, border-color .25s;
}
.chip:hover { transform: translateY(-2px); background: rgba(255,255,255,.14); }
.chip.active {
  background: rgba(232,137,44,.9); border-color: transparent; color:#fff;
  box-shadow: 0 8px 24px rgba(232,137,44,.35);
}

.hero {
  flex: 1; display:flex; flex-direction:column; justify-content:flex-end;
  padding: 0 clamp(20px,5vw,72px) clamp(28px,5vh,56px);
  max-width: 1200px; width: 100%; margin: 0 auto;
  min-height: min(78vh, 720px);
}
.hero-brand {
  font-family: "ZCOOL QingKe HuangYou", "Fredoka", sans-serif;
  font-size: clamp(3.2rem, 9vw, 6.4rem);
  line-height: .95; letter-spacing: .04em;
  color: #fff;
  text-shadow: 0 4px 0 rgba(0,0,0,.18), 0 18px 50px rgba(0,0,0,.35);
  max-width: 12ch;
  animation: rise .9s var(--ease) both;
}
.hero-line {
  margin-top: 18px; max-width: 34ch;
  font-size: clamp(1rem, 2vw, 1.2rem); font-weight: 500;
  color: rgba(247,241,227,.88); line-height: 1.55;
  animation: rise .9s var(--ease) .12s both;
}
.hero-cta { margin-top: 28px; display:flex; flex-wrap:wrap; gap:12px; animation: rise .9s var(--ease) .22s both; }
.btn-primary, .btn-ghost {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height: 52px; padding: 0 26px; border-radius: 999px;
  font-weight: 700; letter-spacing: .02em;
  transition: transform .25s var(--ease), box-shadow .25s, background .25s;
}
.btn-primary {
  background: linear-gradient(135deg, #f0a33a, #e06a1a);
  color: #fff; box-shadow: 0 12px 32px rgba(224,106,26,.4);
}
.btn-primary:hover { transform: translateY(-3px) scale(1.02); }
.btn-ghost {
  border: 1px solid rgba(255,255,255,.28);
  background: rgba(255,255,255,.08); backdrop-filter: blur(8px);
}
.btn-ghost:hover { transform: translateY(-2px); background: rgba(255,255,255,.14); }
@keyframes rise {
  from { opacity:0; transform: translateY(28px); }
  to { opacity:1; transform: translateY(0); }
}

.panel {
  width: min(1100px, calc(100% - 32px));
  margin: 0 auto 40px;
  padding: 22px;
  border-radius: 28px;
  background: rgba(10,18,14,.55);
  border: 1px solid rgba(255,255,255,.12);
  backdrop-filter: blur(18px) saturate(1.2);
  box-shadow: 0 30px 80px rgba(0,0,0,.35);
  animation: rise 1s var(--ease) .3s both;
}
.panel.night-theme {
  background: rgba(8,14,24,.62);
  border-color: rgba(180,210,230,.14);
}
.panel-head {
  display:flex; flex-wrap:wrap; gap:14px; justify-content:space-between; align-items:end;
  margin-bottom: 18px;
}
.panel-title {
  font-family: "Fredoka", "Noto Sans SC", sans-serif;
  font-size: 1.35rem; font-weight: 700;
}
.panel-sub { color: rgba(247,241,227,.65); font-size: .92rem; margin-top: 4px; }
.seg {
  display:inline-flex; padding:4px; border-radius:999px;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
  gap: 4px;
}
.seg button {
  min-width: 88px; padding: 10px 14px; border-radius: 999px;
  font-weight: 600; font-size: .9rem; color: rgba(255,255,255,.7);
  transition: .2s var(--ease);
}
.seg button:hover { color:#fff; }
.seg button.active {
  background: #fff; color: #16301c;
  box-shadow: 0 6px 18px rgba(0,0,0,.2);
}
.panel.night-theme .seg button.active { background: var(--moon); color: #102030; }

.level-grid {
  display:grid;
  grid-template-columns: repeat(5, minmax(0,1fr));
  gap: 10px;
}
@media (max-width: 820px) {
  .level-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
.level-btn {
  position: relative; text-align:left;
  padding: 16px 14px 14px;
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,.1);
  background:
    linear-gradient(160deg, rgba(255,255,255,.1), rgba(255,255,255,.02));
  transition: transform .22s var(--ease), border-color .22s, background .22s;
  overflow: hidden;
}
.level-btn::before {
  content:""; position:absolute; inset:auto -20% -40% auto; width:90px; height:90px;
  border-radius:50%; background: rgba(93,174,74,.25); filter: blur(8px);
  transition: transform .35s var(--ease);
}
.panel.night-theme .level-btn::before { background: rgba(120,170,210,.22); }
.level-btn:hover {
  transform: translateY(-4px);
  border-color: rgba(255,255,255,.28);
  background: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.04));
}
.level-btn:hover::before { transform: scale(1.35); }
.level-btn .lv-id {
  font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 1.15rem;
  position: relative;
}
.level-btn .lv-sub {
  position: relative; margin-top: 6px;
  font-size: .78rem; color: rgba(247,241,227,.62);
}
.level-btn.final {
  border-color: rgba(232,137,44,.45);
  background: linear-gradient(160deg, rgba(232,137,44,.28), rgba(255,255,255,.04));
}
.mode-row {
  display:flex; flex-wrap:wrap; gap:10px; margin-top: 16px;
}
.mode-row .btn-ghost, .mode-row .btn-primary { min-height: 46px; font-size: .95rem; }

/* ===== Leaderboard modal ===== */
#lbModal {
  position: fixed; inset: 0; z-index: 40;
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px;
  background:
    radial-gradient(ellipse 50% 40% at 20% 20%, rgba(255,190,80,.12), transparent 55%),
    radial-gradient(ellipse 45% 50% at 80% 70%, rgba(80,140,180,.14), transparent 50%),
    rgba(6,12,10,.72);
  backdrop-filter: blur(14px) saturate(1.15);
  animation: rise .45s var(--ease) both;
}
#lbModal.hidden { display: none !important; }
.lb-card {
  width: min(520px, 100%);
  max-height: min(82vh, 640px);
  overflow: auto;
  border-radius: 28px;
  padding: 26px 24px 22px;
  background: rgba(12,20,16,.72);
  border: 1px solid rgba(255,255,255,.14);
  box-shadow: 0 30px 80px rgba(0,0,0,.45);
  color: var(--cream);
}
.lb-card h2 {
  font-family: "ZCOOL QingKe HuangYou", "Fredoka", sans-serif;
  font-size: 1.7rem; text-align: center; margin-bottom: 14px;
  letter-spacing: .04em;
}
.lb-tabs {
  display: flex; gap: 8px; justify-content: center; margin-bottom: 16px;
}
.lb-tabs button {
  min-width: 132px; padding: 10px 14px; border-radius: 999px;
  border: 1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.06);
  font-weight: 600; color: rgba(247,241,227,.72);
  transition: .2s var(--ease);
}
.lb-tabs button:hover { color: #fff; background: rgba(255,255,255,.12); }
.lb-tabs button.active {
  background: linear-gradient(135deg, #f0a33a, #e06a1a);
  border-color: transparent; color: #fff;
  box-shadow: 0 8px 22px rgba(224,106,26,.35);
}
.lb-list { display: flex; flex-direction: column; gap: 8px; min-height: 180px; }
.lb-item {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 14px; border-radius: 14px;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.06);
}
.lb-item.top {
  background: linear-gradient(135deg, rgba(242,184,74,.18), rgba(255,255,255,.04));
  border-color: rgba(242,184,74,.28);
}
.lb-item .rank { width: 2.2em; font-weight: 700; color: #f2b84a; }
.lb-item .name { flex: 1; text-align: left; color: rgba(247,241,227,.92); }
.lb-item .val { font-weight: 700; color: #f2b84a; }
.lb-empty {
  text-align: center; color: rgba(247,241,227,.55);
  padding: 48px 12px; line-height: 1.6;
}
.lb-note {
  margin: 14px 0 16px; text-align: center;
  font-size: .78rem; color: rgba(247,241,227,.45); line-height: 1.45;
}
.lb-actions { display: flex; justify-content: center; }

/* ===== Game shell ===== */
#app {
  min-height: 100vh; display:flex; flex-direction:column; align-items:center;
  justify-content:center; padding: 16px 12px 24px;
  background:
    radial-gradient(ellipse 70% 50% at 50% 0%, rgba(80,120,60,.25), transparent 55%),
    #0d1610;
}
#app.night-mode {
  background:
    radial-gradient(ellipse 60% 45% at 70% 10%, rgba(90,130,170,.2), transparent 50%),
    #070c14;
}
#wrap {
  position: relative; width: min(960px, 100%);
  border-radius: 20px; overflow: hidden;
  box-shadow: 0 24px 64px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08);
  background: #1a2a18;
}
#app.night-mode #wrap { background: #101820; }
canvas { display:block; width:100%; height:auto; cursor:pointer; }
#overlay {
  position:absolute; inset:0; display:none;
  align-items:center; justify-content:center;
  background: rgba(8,12,10,.68); backdrop-filter: blur(8px);
  flex-direction:column; color:#fff; text-align:center; padding:20px;
}
#overlay.show { display:flex; }
#overlay h2 {
  font-family: "ZCOOL QingKe HuangYou", "Fredoka", sans-serif;
  font-size: clamp(2rem, 5vw, 2.8rem); margin-bottom:10px;
  text-shadow: 0 4px 24px rgba(0,0,0,.4);
}
#overlay p { font-size:16px; opacity:.92; margin-bottom:14px; max-width:420px; line-height:1.55; }
#ovLeaderboard {
  max-width:420px; width:100%; margin-bottom:18px; text-align:left;
  background: rgba(0,0,0,.3); border-radius:14px; padding:12px 18px;
  border:1px solid rgba(255,255,255,.12);
}
#ovLeaderboard h3 { font-size:16px; color:#f2c14b; margin-bottom:8px; text-align:center; }
#ovLeaderboard .lb-row { font-size:14px; line-height:1.8; display:flex; justify-content:space-between; }
#ovLeaderboard .lb-note { font-size:12px; color:rgba(255,255,255,.45); text-align:center; margin-top:8px; }
#overlay .ov-actions { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
#overlay button {
  padding:12px 26px; font-size:16px; border:none; border-radius:999px;
  background: linear-gradient(135deg,#f0a33a,#e06a1a); color:#fff;
  cursor:pointer; font-weight:700; box-shadow:0 8px 22px rgba(224,106,26,.35);
  transition: transform .2s var(--ease);
}
#overlay button.secondary { background: linear-gradient(135deg,#6ecf5a,#3d9a36); box-shadow:0 8px 22px rgba(61,154,54,.3); }
#overlay button.ghost { background: rgba(255,255,255,.12); box-shadow:none; border:1px solid rgba(255,255,255,.22); }
#overlay button:hover { transform: translateY(-2px) scale(1.03); }
.tip {
  margin-top: 12px; font-size:12px; color: rgba(247,241,227,.55);
  padding: 8px 14px; border-radius:999px; background: rgba(255,255,255,.06);
}
#cheatInput {
  position:absolute; top:1.8%; left:85.3%; width:12.7%; height:6.4%;
  font-size:14px; text-align:center; box-sizing:border-box;
  border:2px solid #8b5a2b; border-radius:6px;
  background:rgba(255,255,255,.95); color:#5a4a3a;
  z-index:10; display:none; outline:none;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
  <div id="landing">
    <nav class="landing-nav">
      <div class="brand-mark">庭院防线</div>
      <div class="nav-actions">
        <button type="button" class="chip" id="navLbBtn">通关榜</button>
        <button type="button" class="chip" id="navEndlessBtn">无尽</button>
      </div>
    </nav>
    <section class="hero">
      <h1 class="hero-brand">植物大战僵尸</h1>
      <p class="hero-line">从晨光草坪到月下墓园，守护你的庭院。选关即开打。</p>
      <div class="hero-cta">
        <button type="button" class="btn-primary" id="ctaScroll">选择关卡</button>
        <button type="button" class="btn-ghost" id="ctaWeekly">每周挑战</button>
      </div>
    </section>
    <section class="panel" id="playPanel">
      <div class="panel-head">
        <div>
          <div class="panel-title" id="panelTitle">白天冒险</div>
          <div class="panel-sub" id="panelSub">1-1 至 1-10 · 阳光与豌豆</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:10px; align-items:flex-end;">
          <div class="seg" id="worldSeg">
            <button type="button" data-world="day" class="active">白天</button>
            <button type="button" data-world="night">黑夜</button>
          </div>
          <div class="seg" id="diffSeg">
            <button type="button" data-diff="easy">简单</button>
            <button type="button" data-diff="normal" class="active">普通</button>
            <button type="button" data-diff="hard">困难</button>
          </div>
        </div>
      </div>
      <div class="level-grid" id="levelGrid"></div>
      <div class="mode-row">
        <button type="button" class="btn-ghost" id="btnEndless">无尽模式</button>
        <button type="button" class="btn-ghost" id="btnLb">排行榜</button>
      </div>
    </section>
  </div>

  <div id="lbModal" class="hidden" aria-hidden="true">
    <div class="lb-card">
      <h2 id="lbTitle">通关次数排行榜</h2>
      <div class="lb-tabs">
        <button type="button" data-tab="clears" class="active">通关次数</button>
        <button type="button" data-tab="sun">本周阳光</button>
      </div>
      <div class="lb-list" id="lbList"></div>
      <p class="lb-note" id="lbNote"></p>
      <div class="lb-actions">
        <button type="button" class="btn-primary" id="lbCloseBtn">返回</button>
      </div>
    </div>
  </div>

  <div id="app" class="hidden">
    <div id="wrap">
      <canvas id="game" width="900" height="560"></canvas>
      <input id="cheatInput" type="password" autocomplete="off">
      <div id="overlay">
        <h2 id="ovTitle"></h2>
        <p id="ovText"></p>
        <div id="ovLeaderboard"></div>
        <div class="ov-actions">
          <button id="ovNextBtn" style="display:none">下一关</button>
          <button id="ovBtn" class="secondary">再来一局</button>
          <button id="ovMenuBtn" class="ghost">返回主菜单</button>
        </div>
      </div>
    </div>
    <p class="tip">植物过多先选卡 · 点阳光收集 · 铲子移除 · ESC / P 暂停</p>
  </div>

<script>
"use strict";
/* ===== 基础工具 ===== */
const C = document.getElementById("game");
const ctx = C.getContext("2d");
const W = C.width, H = C.height;
const landingEl = document.getElementById("landing");
const appEl = document.getElementById("app");
const playPanel = document.getElementById("playPanel");
const levelGrid = document.getElementById("levelGrid");
const ASSETS = Object.assign({
  hero: "assets/hero-bg.jpg",
  nightLawn: "assets/night-lawn.jpg",
  dayLawn: "assets/day-lawn.jpg",
  house: "assets/house-side.png",
  mower: "assets/mower-cart.png"
}, window.__ASSETS__ || {});
if(ASSETS.hero) document.documentElement.style.setProperty("--hero-bg", 'url("' + ASSETS.hero + '")');

let nightLawnImg = null, nightLawnReady = false;
let dayLawnImg = null, dayLawnReady = false;
let houseImg = null, houseReady = false;
let mowerImg = null, mowerReady = false;
function loadImg(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=> resolve(img);
    img.onerror = ()=> reject(new Error("load fail: " + src));
    img.src = src;
  });
}
(function loadArtAssets(){
  loadImg(ASSETS.nightLawn).then(img=>{
    nightLawnImg = img; nightLawnReady = true;
  }).catch(()=>{ nightLawnReady = false; });
  loadImg(ASSETS.dayLawn).then(img=>{
    dayLawnImg = img; dayLawnReady = true;
  }).catch(()=>{ dayLawnReady = false; });
  loadImg(ASSETS.house).then(img=>{
    houseImg = img; houseReady = true;
  }).catch(()=>{ houseReady = false; });
  loadImg(ASSETS.mower).then(img=>{
    mowerImg = img; mowerReady = true;
  }).catch(()=>{ mowerReady = false; });
})();
function drawPlantIcon(key, now, i){
  const fake = {anim:now, hp:(PLANTS[key]&&PLANTS[key].hp)||300, cx:i||0, armed:true, grown:true};
  if(key==="sunflower") drawSunflower(fake);
  else if(key==="peashooter") drawPeashooter(fake);
  else if(key==="repeaterpea") drawRepeater(fake);
  else if(key==="snowpea") drawSnowPea(fake);
  else if(key==="chomper") drawChomper(fake);
  else if(key==="threepeater") drawThreepeater(fake);
  else if(key==="wallnut") drawWallnut(fake);
  else if(key==="potatomine") drawPotato(fake);
  else if(key==="cherrybomb") drawCherry(fake);
  else if(key==="puffshroom") drawPuffShroom(fake);
  else if(key==="sunshroom") drawSunShroom(fake);
  else if(key==="fumeshroom") drawFumeShroom(fake);
  else if(key==="gravebuster") drawGraveBuster(fake);
  else if(key==="hypnoshroom") drawHypnoShroom(fake);
  else if(key==="scaredyshroom") drawScaredyShroom(fake);
  else if(key==="iceshroom") drawIceShroom(fake);
  else if(key==="doomshroom") drawDoomShroom(fake);
}
function showLanding(){
  if(landingEl) landingEl.classList.remove("hidden");
  if(appEl) appEl.classList.add("hidden");
  state = "menu";
  paused = false;
  if(overlay) overlay.classList.remove("show");
  closeLeaderboardModal();
  refreshLandingLevels();
}
function showGameShell(){
  if(landingEl) landingEl.classList.add("hidden");
  if(appEl){
    appEl.classList.remove("hidden");
    if(isNightLevel()) appEl.classList.add("night-mode");
    else appEl.classList.remove("night-mode");
  }
}
function refreshLandingLevels(){
  if(!levelGrid) return;
  const list = getWorldLevels();
  const night = curWorld === "night";
  if(playPanel) playPanel.classList.toggle("night-theme", night);
  const title = document.getElementById("panelTitle");
  const sub = document.getElementById("panelSub");
  if(title) title.textContent = night ? "黑夜冒险" : "白天冒险";
  if(sub) sub.textContent = night ? "2-1 至 2-10 · 蘑菇与墓园" : "1-1 至 1-10 · 阳光与豌豆";
  levelGrid.innerHTML = "";
  list.forEach((lv)=>{
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "level-btn" + (lv.id === list.length-1 ? " final" : "");
    const short = (lv.title || "").replace(/^(白天|黑夜)\s*/, "");
    btn.innerHTML = '<div class="lv-id">'+short+'</div><div class="lv-sub">'+(lv.sub||"")+'</div>';
    btn.addEventListener("click", ()=> newGame(window.__SEED__, lv.id, "normal", curWorld));
    levelGrid.appendChild(btn);
  });
  document.querySelectorAll("#worldSeg button").forEach(b=>{

/* 伪随机数生成器（可种子化，用于回放校验） */
function makeRng(seed){
  let s = seed >>> 0 || 1;
  return function(){
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
let rng = makeRng(Date.now() & 0xffffffff);

/* ISO 周数（周一到周日），双端一致；服务端注入 window.__WEEK__ 时也用此算法 */
function isoWeek(d){
  const date = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  const weekNum = Math.ceil((((date - yearStart)/86400000) + 1)/7);
  return date.getUTCFullYear() + "W" + String(weekNum).padStart(2,"0");
}

  ROWS = lv.rows;
  GRID_Y = calcGridY(ROWS);
  const diff = getDiff();
  INIT_SUN = lv.initSun + (diff.initSunBonus || 0);

function getPickLayout(){

  const slotN = MAX_SEED_SLOTS;
  const bankW = slotN * slotW + (slotN - 1) * slotGap;
  const bankX = (W - bankW) / 2;
  const bankY = 56;
  const poolCols = 6;
  const poolCardW = 92, poolCardH = 96, poolGapX = 10, poolGapY = 10;
  const poolW = poolCols * poolCardW + (poolCols - 1) * poolGapX;

/* ===== 波次生成（参考 pypvz level.py createWaves） ===== */
function buildWave(n){
  const diff = getDiff();
  let vol = Math.floor(n*0.8/2)+1;
  let big = (n % 10 === 0);
  if(big) vol = Math.floor(vol*2.5);
  if(isEndless()){
    vol = Math.floor(vol * (1 + Math.min(n, 80) * 0.02));
    if(n >= 15){
      ["newspaper","football","screendoor"].forEach(k=>{
        if(!curZombies.includes(k)) curZombies.push(k);
      });
    }
  }
  vol = Math.max(1, Math.floor(vol * diff.volMul));
  let list = [];
  if(big) list.push("flag");
  for(let i=list.length;i<vol;i++){
    const r = rng();
    if(curZombies.includes("football") && n >= (isEndless()?8:5) && r < 0.14 + Math.min(n,40)*0.003){
      list.push("football");
    } else if(curZombies.includes("buckethead") && n >= 5 && r < 0.15){
      list.push("buckethead");
    } else if(curZombies.includes("screendoor") && n >= 4 && r < 0.16){
      list.push("screendoor");
    } else if(curZombies.includes("polevaulter") && n >= 3 && r < 0.25){
      list.push("polevaulter");
    } else if(curZombies.includes("newspaper") && n >= 3 && r < 0.18){
      list.push("newspaper");
    } else if(curZombies.includes("conehead") && n >= 3 && r < Math.min(0.15 + n*0.03, 0.45)){
      list.push("conehead");
    } else {
      list.push("normal");
    }
  }
  return list;
}

/* ===== 坐标转换 ===== */
function cellAt(px, py){
  const cx = Math.floor((px-GRID_X)/CELL_W);
  const cy = Math.floor((py-GRID_Y)/CELL_H);
  if(cx<0||cx>=COLS||cy<0||cy>=ROWS) return null;
  return {x:cx, y:cy};
}
function cellCenter(cx, cy){
  return { x: GRID_X + cx*CELL_W + CELL_W/2, y: GRID_Y + cy*CELL_H + CELL_H/2 };
}

/* ===== 绘制：草地背景 ===== */
function drawBackground(){
  const night = isNightLevel() || (state==="menu" && curWorld==="night");
  const lawnX = GRID_X, lawnY = GRID_Y, lawnW = COLS*CELL_W, lawnH = ROWS*CELL_H;

  /* 顶栏 */
  const barGrad = ctx.createLinearGradient(0,0,0,GRID_Y-20);
  if(night){ barGrad.addColorStop(0,"#121a28"); barGrad.addColorStop(1,"#1c2a3c"); }
  else { barGrad.addColorStop(0,"#6f4a24"); barGrad.addColorStop(1,"#8b5a2b"); }
  ctx.fillStyle = barGrad;
  ctx.fillRect(0, 0, W, GRID_Y-20);

  /* 左侧房屋区：保持比例，底对齐，不再纵向拉扁 */
  const houseBg = ctx.createLinearGradient(0, GRID_Y, GRID_X, GRID_Y);
  if(night){
    houseBg.addColorStop(0,"#182030"); houseBg.addColorStop(0.65,"#243428"); houseBg.addColorStop(1,"#2a4030");
  } else {
    houseBg.addColorStop(0,"#9ecf6a"); houseBg.addColorStop(0.55,"#b8e07a"); houseBg.addColorStop(1,"#a8d96e");
  }
  ctx.fillStyle = houseBg;
  ctx.fillRect(0, GRID_Y, GRID_X, ROWS*CELL_H);
  /* 树篱暗示 */
  ctx.fillStyle = night ? "rgba(20,40,28,.45)" : "rgba(60,120,40,.22)";
  for(let i=0;i<6;i++){
    const bx = 8 + (i%3)*28;
    const by = GRID_Y + 30 + Math.floor(i/3)* (ROWS*CELL_H*0.35);
    ctx.beginPath(); ctx.ellipse(bx, by, 22, 34, 0, 0, 7); ctx.fill();
  }
  if(houseReady && houseImg){
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, GRID_Y, GRID_X, ROWS*CELL_H);
    ctx.clip();
    const maxW = GRID_X - 6;
    const maxH = ROWS * CELL_H - 10;
    const iw = houseImg.naturalWidth || houseImg.width;
    const ih = houseImg.naturalHeight || houseImg.height;
    let dw = maxW;
    let dh = dw * (ih / Math.max(1, iw));
    if(dh > maxH){
      dh = maxH;
      dw = dh * (iw / Math.max(1, ih));
    }
    const hx = Math.max(2, (GRID_X - dw) / 2);
    const hy = GRID_Y + ROWS*CELL_H - dh - 2;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(houseImg, hx, hy, dw, dh);
    if(night){
      ctx.fillStyle = "rgba(8,14,28,.32)";
      ctx.fillRect(0, GRID_Y, GRID_X, ROWS*CELL_H);
    }
    ctx.restore();
  } else {
    ctx.fillStyle = night ? "#4a3a2a" : "#c4915a";
    ctx.fillRect(28, GRID_Y+ROWS*CELL_H*0.28, 70, ROWS*CELL_H*0.55);
    ctx.fillStyle = night ? "#2e2418" : "#a86a3a";
    ctx.beginPath();
    ctx.moveTo(20, GRID_Y+ROWS*CELL_H*0.32);
    ctx.lineTo(63, GRID_Y+ROWS*CELL_H*0.18);
    ctx.lineTo(106, GRID_Y+ROWS*CELL_H*0.32);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = night ? "#1a140e" : "#7a4a28";
    ctx.fillRect(52, GRID_Y+ROWS*CELL_H-48, 26, 34);
  }

  /* 草坪贴图 */
  const lawnTex = night
    ? (nightLawnReady ? nightLawnImg : null)
    : (dayLawnReady ? dayLawnImg : null);
  if(lawnTex){
    ctx.save();
    ctx.beginPath(); ctx.rect(lawnX, lawnY, lawnW, lawnH); ctx.clip();
    ctx.drawImage(lawnTex, lawnX, lawnY, lawnW, lawnH);
    for(let y=0;y<ROWS;y++){
      ctx.fillStyle = night
        ? ((y%2===0) ? "rgba(0,0,0,.12)" : "rgba(255,255,255,.04)")
        : ((y%2===0) ? "rgba(40,90,20,.10)" : "rgba(255,255,220,.07)");
      ctx.fillRect(lawnX, lawnY+y*CELL_H, lawnW, CELL_H);
    }
    /* 轻微纵向景深 */
    const depth = ctx.createLinearGradient(0, lawnY, 0, lawnY+lawnH);
    depth.addColorStop(0, night ? "rgba(8,14,24,.18)" : "rgba(255,245,200,.10)");
    depth.addColorStop(1, night ? "rgba(0,0,0,.22)" : "rgba(30,70,20,.12)");
    ctx.fillStyle = depth;
    ctx.fillRect(lawnX, lawnY, lawnW, lawnH);
    ctx.restore();
  } else {
    for(let y=0;y<ROWS;y++){
      if(night) ctx.fillStyle = (y%2===0) ? "#2a4a34" : "#23402c";
      else ctx.fillStyle = (y%2===0) ? "#a8d96e" : "#b4e07a";
      ctx.fillRect(lawnX, lawnY+y*CELL_H, lawnW, CELL_H);
    }
  }
  ctx.strokeStyle = night ? "rgba(180,210,200,.10)" : "rgba(40,80,20,.12)";
  ctx.lineWidth = 1;
  for(let x=0;x<=COLS;x++){
    ctx.beginPath();
    ctx.moveTo(lawnX+x*CELL_W, lawnY);
    ctx.lineTo(lawnX+x*CELL_W, lawnY+lawnH);
    ctx.stroke();
  }
  for(let y=0;y<=ROWS;y++){
    ctx.beginPath();
    ctx.moveTo(lawnX, lawnY+y*CELL_H);
    ctx.lineTo(lawnX+lawnW, lawnY+y*CELL_H);
    ctx.stroke();
  }

  /* 墓碑 */
  if(Array.isArray(graves)){
    for(const g of graves){
      const cx = lawnX + g.x*CELL_W + CELL_W/2;
      const cy = lawnY + g.y*CELL_H + CELL_H/2 + 10;
      ctx.fillStyle = "rgba(0,0,0,.28)";
      ctx.beginPath(); ctx.ellipse(cx, cy+18, 16, 5, 0, 0, 7); ctx.fill();
      const gg = ctx.createLinearGradient(cx-14, cy-34, cx+14, cy+16);
      gg.addColorStop(0,"#8a919c"); gg.addColorStop(0.55,"#5c636e"); gg.addColorStop(1,"#3a4048");
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.roundRect(cx-15, cy-32, 30, 44, 8); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = "#2a2e34";
      ctx.fillRect(cx-17, cy+10, 34, 6);
      ctx.fillStyle = "rgba(220,230,240,.55)";
      ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("RIP", cx, cy-6);
      ctx.strokeStyle = "rgba(200,210,220,.35)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(cx, cy-22); ctx.lineTo(cx, cy-12);
      ctx.moveTo(cx-4, cy-18); ctx.lineTo(cx+4, cy-18); ctx.stroke();
    }
  }

  if(night){
    const veil = ctx.createLinearGradient(lawnX, lawnY, lawnX+lawnW, lawnY);
    veil.addColorStop(0,"rgba(10,18,28,.18)");
    veil.addColorStop(0.55,"rgba(8,14,24,.08)");
    veil.addColorStop(1,"rgba(20,40,70,.28)");
    ctx.fillStyle = veil;
    ctx.fillRect(lawnX, lawnY, lawnW, lawnH);
    ctx.fillStyle = "rgba(210,225,240,.85)";
    ctx.beginPath(); ctx.arc(W-54, lawnY+28, 18, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(210,225,240,.12)";
    ctx.beginPath(); ctx.arc(W-54, lawnY+28, 34, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(8,14,24,.35)";
    ctx.beginPath(); ctx.arc(W-46, lawnY+24, 13, 0, 7); ctx.fill();
    for(let i=0;i<18;i++){
      const sx = lawnX + ((i*97)%lawnW);
      const sy = lawnY + ((i*53)%Math.max(1,lawnH-20));
      ctx.fillStyle = "rgba(230,240,255,"+(0.15+((i%3)*0.08))+")";
      ctx.fillRect(sx, sy, 1.5, 1.5);
    }
  }

  for(let y=0;y<ROWS;y++){
    if(!mowers[y]) continue;
    const my = GRID_Y + y*CELL_H + CELL_H/2;
    drawMowerBody(GRID_X-26, my);
  }
}

/* 割草机车身 */
function drawMowerBody(x, cy){

  ctx.fillStyle = "#9aa0a6";

  ctx.fillStyle = "#7a8086";

  ctx.strokeStyle = "#5f6368"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x+19, cy-12); ctx.lineTo(x+26, cy-16); ctx.stroke();
  ctx.fillStyle = "#c0c4c8";
  ctx.fillRect(x-4, cy-4, 6, 14);
  ctx.strokeStyle = "#5f6368"; ctx.lineWidth = 1;

    ctx.beginPath(); ctx.moveTo(x-4, cy-4+i*5); ctx.lineTo(x+2, cy-4+i*5); ctx.stroke();
  }

}

/* ===== 绘制：植物（自绘矢量，不使用外部精灵图） ===== */
function drawPlant(p, cx, cy){
  const t = p.type;
  ctx.save();
  ctx.translate(cx, cy);
  const bob = Math.sin(p.anim*0.004 + p.cx*0.7)*2;
  ctx.translate(0, bob);
  if(t==="sunflower") drawSunflower(p);
  else if(t==="peashooter") drawPeashooter(p);
  else if(t==="repeaterpea") drawRepeater(p);
  else if(t==="snowpea") drawSnowPea(p);
  else if(t==="chomper") drawChomper(p);
  else if(t==="threepeater") drawThreepeater(p);
  else if(t==="wallnut") drawWallnut(p);
  else if(t==="potatomine") drawPotato(p);
  else if(t==="cherrybomb") drawCherry(p);
  else if(t==="puffshroom") drawPuffShroom(p);
  else if(t==="sunshroom") drawSunShroom(p);
  else if(t==="fumeshroom") drawFumeShroom(p);
  else if(t==="gravebuster") drawGraveBuster(p);
  else if(t==="hypnoshroom") drawHypnoShroom(p);
  else if(t==="scaredyshroom") drawScaredyShroom(p);
  else if(t==="iceshroom") drawIceShroom(p);
  else if(t==="doomshroom") drawDoomShroom(p);
  ctx.restore();
  /* 引信阶段显示爆炸范围 */
  if((t==="doomshroom" || t==="cherrybomb") && p.fuse != null && p.fuse > 0){
    const cellR = t==="doomshroom" ? DOOM_RANGE : 1.5;
    const pulse = 0.25 + 0.2 * Math.sin((p.anim||0) * 0.02);
    ctx.save();
    ctx.strokeStyle = t==="doomshroom"
      ? ("rgba(180,40,220," + (0.45 + pulse) + ")")
      : ("rgba(255,80,60," + (0.4 + pulse) + ")");
    ctx.fillStyle = t==="doomshroom"
      ? ("rgba(120,20,160," + (0.08 + pulse * 0.08) + ")")
      : ("rgba(255,60,40," + (0.07 + pulse * 0.06) + ")");
    ctx.lineWidth = 2;
    const rw = CELL_W * cellR * 2;
    const rh = CELL_H * cellR * 2;
    ctx.beginPath();
    ctx.roundRect(cx - rw/2, cy - rh/2, rw, rh, 10);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  const def = PLANTS[t];
  if(def && p.hp < def.hp && isFinite(def.hp)){
    const w = 44, hpf = p.hp/def.hp;
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.fillRect(cx-w/2, cy-36, w, 4);
    ctx.fillStyle = hpf>0.5?"#7ec850":(hpf>0.25?"#f0a830":"#e0584c");
    ctx.fillRect(cx-w/2, cy-36, w*hpf, 4);
  }
}
function drawSunflower(p){
  const glow = p.sunTimer != null && p.sunTimer < 1500;
  ctx.strokeStyle = "#5a8a2a"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0,20); ctx.lineTo(0,36); ctx.stroke();
  if(p.bounceT > 0){ ctx.translate(0, -Math.sin((1-p.bounceT/300)*Math.PI)*8); }
  const r = 18;
  if(glow){
    const pulse = 0.6 + Math.sin(p.anim*0.02)*0.4;
    const gg = ctx.createRadialGradient(0,-6,4,0,-6,30);
    gg.addColorStop(0, "rgba(255,240,150,"+(0.55*pulse)+")");
    gg.addColorStop(1, "rgba(255,240,150,0)");
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(0,-6,30,0,7); ctx.fill();
  }
  ctx.fillStyle = glow ? "#ffe066" : "#ffc928";
  for(let i=0;i<8;i++){
    const a = i*Math.PI/4 + p.anim*0.0008;
    ctx.beginPath();
    ctx.ellipse(Math.cos(a)*r, Math.sin(a)*r - 6, 7, 11, a, 0, 7);
    ctx.fill();
  }
  ctx.fillStyle = glow ? "#d9a030" : "#8b5a2b";
  ctx.beginPath(); ctx.arc(0,-6,12,0,7); ctx.fill();
  ctx.fillStyle = "#3a2a1a";
  ctx.beginPath(); ctx.arc(-4,-8,2,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(4,-8,2,0,7); ctx.fill();
  ctx.strokeStyle = "#3a2a1a"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0,-4,3,0.1,Math.PI-0.1); ctx.stroke();
}

function drawChomper(p){
  ctx.strokeStyle = "#5a8a2a"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0,16); ctx.lineTo(0,34); ctx.stroke();
  ctx.fillStyle = "#6cbb3c";
  ctx.beginPath(); ctx.ellipse(-12,24,7,4,-0.5,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(12,24,7,4,0.5,0,7); ctx.fill();
  const openRaw = p.chewing ? (Math.sin(p.anim*0.012)*0.08+0.05) : (Math.sin(p.anim*0.003)*0.15+0.45);
  const open = Math.max(0.01, openRaw);

  ctx.stroke();

function drawZombie(z){
  const cx = z.x, cy = z.y;
  ctx.save();
  ctx.translate(cx, cy);
  /* 撑杆跳跳跃动画 */
  if(z.jumping){
    const jp = z.jumpProgress || 0;
    ctx.translate(0, -Math.sin(jp*Math.PI)*30);
  }
  const walk = Math.sin(z.anim*0.008)*3;
  ctx.fillStyle = "rgba(0,0,0,.18)";
  ctx.beginPath(); ctx.ellipse(0,30,16,5,0,0,7); ctx.fill();
  ctx.fillStyle = "#7a8b5a";
  ctx.fillRect(-8, 14+walk, 6, 14);
  ctx.fillRect(2, 14-walk, 6, 14);
  ctx.fillStyle = "#8a9b6a";
  ctx.beginPath(); ctx.roundRect(-11, -6, 22, 22, 5); ctx.fill();
  ctx.fillStyle = "#9aab7a";
  ctx.fillRect(-16, 0, 8, 6);
  ctx.fillRect(8, 0, 8, 6);
  ctx.fillStyle = "#b5c098";
  ctx.beginPath(); ctx.arc(0, -16, 12, 0, 7); ctx.fill();
  ctx.fillStyle = "#5a4a3a";
  ctx.beginPath(); ctx.arc(0,-22,12,Math.PI*1.1,Math.PI*1.9); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(-4,-17,3,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(4,-17,3,0,7); ctx.fill();
  ctx.fillStyle = "#c0342a";
  ctx.beginPath(); ctx.arc(-4,-17,1.5,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(4,-17,1.5,0,7); ctx.fill();
  ctx.fillStyle = "#3a1a1a";
  ctx.fillRect(-4,-10,8,3);
  ctx.fillStyle = "#eee";
  ctx.fillRect(-3,-10,2,2); ctx.fillRect(1,-10,2,2);
  /* 路障 */
  if(z.kind === "conehead" && z.helmet > 0){
    const hf = z.helmet / z.maxHelmet;
    ctx.fillStyle = "#e8822a";
    ctx.beginPath();
    ctx.moveTo(-10, -24); ctx.lineTo(10, -24); ctx.lineTo(0, -43);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#c46818";
    ctx.fillRect(-10, -25, 20, 3);
    ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.fillRect(-7, -31, 14, 3);
    ctx.fillRect(-5, -37, 10, 2.5);
    if(hf < 0.6){
      ctx.strokeStyle = "rgba(80,40,10,.7)"; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-4,-26); ctx.lineTo(2,-33); ctx.lineTo(-2,-39); ctx.stroke();
    }
    if(hf < 0.3){
      ctx.beginPath(); ctx.moveTo(5,-28); ctx.lineTo(-1,-35); ctx.stroke();
    }
  }
  /* 铁桶 */
  if(z.kind === "buckethead" && z.helmet > 0){
    const hf = z.helmet / z.maxHelmet;
    ctx.fillStyle = "#888";
    ctx.fillRect(-12, -30, 24, 20);
    ctx.fillStyle = "#aaa";
    ctx.fillRect(-12, -30, 24, 4);
    ctx.fillStyle = "#666";
    ctx.fillRect(-12, -14, 24, 4);
    ctx.fillStyle = "rgba(255,255,255,.2)";
    ctx.fillRect(-9, -28, 4, 16);
    if(hf < 0.6){
      ctx.strokeStyle = "rgba(40,40,40,.6)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-6,-26); ctx.lineTo(2,-18); ctx.stroke();
    }
    if(hf < 0.3){
      ctx.beginPath(); ctx.moveTo(6,-28); ctx.lineTo(-2,-16); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-8,-20); ctx.lineTo(0,-14); ctx.stroke();
    }
  }
  /* 撑杆跳杆子 */
  if(z.kind === "polevaulter" && z.hasPole){
    ctx.strokeStyle = "#8b5a2b"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-18, 10); ctx.quadraticCurveTo(-30, -20, -10, -35);
    ctx.stroke();
  }
  /* 旗帜 */
  if(z.kind==="flag"){
    ctx.strokeStyle = "#8b5a2b"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(12,-28); ctx.lineTo(12,-6); ctx.stroke();
    ctx.fillStyle = "#e04444";
    const fw = 14 + Math.sin(z.anim*0.01)*3;
    ctx.beginPath();
    ctx.moveTo(12,-28); ctx.lineTo(12+fw,-24); ctx.lineTo(12,-18);
    ctx.closePath(); ctx.fill();
  }
  /* 读报僵尸：报纸盾 / 狂暴表情 */
  if(z.kind === "newspaper"){
    if(z.helmet > 0){
      ctx.fillStyle = "#f5f0e0";
      ctx.fillRect(-15, -8, 20, 24);
      ctx.strokeStyle = "#c0b890"; ctx.lineWidth = 1;
      ctx.strokeRect(-15, -8, 20, 24);
      ctx.fillStyle = "#5a4a3a";
      ctx.fillRect(-13, -5, 16, 1.5);
      for(let i=0;i<5;i++){ ctx.fillRect(-13, -1+i*4, 16, 0.8); }
    } else {
      ctx.fillStyle = "#c0342a";
      ctx.beginPath(); ctx.arc(-4,-17,2.2,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(4,-17,2.2,0,7); ctx.fill();
      ctx.strokeStyle = "#c0342a"; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(-7,-21); ctx.lineTo(-2,-19); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(7,-21); ctx.lineTo(2,-19); ctx.stroke();
      if(Math.floor(z.anim/150)%2 === 0){
        ctx.fillStyle = "#e04444";
        ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
        ctx.fillText("!", 13, -22);
      }
    }
  }
  /* 橄榄球僵尸：头盔 + 护甲 */
  if(z.kind === "football"){
    ctx.fillStyle = "#3a5a3a";
    ctx.beginPath(); ctx.roundRect(-14, -8, 28, 22, 5); ctx.fill();
    if(z.helmet > 0){
      const hf = z.helmet / z.maxHelmet;
      ctx.fillStyle = "#4a3a2a";
      ctx.beginPath(); ctx.ellipse(0, -22, 14, 11, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = "#d8b020";
      ctx.fillRect(-13, -20, 26, 3);
      ctx.strokeStyle = "#1a1a1a"; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-9,-22); ctx.lineTo(9,-22); ctx.stroke();
      for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(i*4,-26); ctx.lineTo(i*4,-18); ctx.stroke(); }
      ctx.fillStyle = "rgba(0,0,0,.25)";
      ctx.fillRect(-12, -28, 4, 8);
      if(hf < 0.5){
        ctx.strokeStyle = "rgba(20,20,20,.6)"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-6,-24); ctx.lineTo(4,-18); ctx.stroke();
      }
    }
  }
  /* 铁网门僵尸：铁网门盾（挡在前方左侧，迎向豌豆） */
  if(z.kind === "screendoor" && z.helmet > 0){
    const hf = z.helmet / z.maxHelmet;
    ctx.fillStyle = "#9a9a9a";
    ctx.fillRect(-18, -26, 12, 48);
    ctx.fillStyle = "#7a7a7a";
    ctx.fillRect(-18, -26, 12, 4);
    ctx.fillRect(-18, 18, 12, 4);
    ctx.strokeStyle = "#4a4a4a"; ctx.lineWidth = 0.7;
    for(let i=1;i<6;i++){ ctx.beginPath(); ctx.moveTo(-18, -26+i*8); ctx.lineTo(-6, -26+i*8); ctx.stroke(); }
    for(let i=1;i<2;i++){ ctx.beginPath(); ctx.moveTo(-18+i*6, -26); ctx.lineTo(-18+i*6, 22); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(-12, -26); ctx.lineTo(-12, 22); ctx.stroke();
    if(hf < 0.5){
      ctx.strokeStyle = "rgba(40,40,40,.6)"; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-16,-18); ctx.lineTo(-8,2); ctx.stroke();
    }
  }
  /* 舞王帽子 */
  if(z.kind === "dancing"){
    ctx.fillStyle = "#2a2a2a";
    ctx.beginPath(); ctx.ellipse(0, -26, 14, 6, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#e04444";
    ctx.fillRect(-10, -34, 20, 8);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("♪", 0, -26);
  }
  if(z.kind === "backup"){
    ctx.fillStyle = "#c04080";
    ctx.beginPath(); ctx.roundRect(-11, -6, 22, 22, 5); ctx.fill();
  }
  /* 魅惑（我方） */
  if(z.hypno){
    ctx.fillStyle = "rgba(208,96,192,.4)";
    ctx.beginPath(); ctx.roundRect(-17, -28, 34, 54, 8); ctx.fill();
    ctx.fillStyle = "#e080d0";
    ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("♥", 0, -34);
  }
  /* 减速冰冻效果 */
  if(z.frozen > 0){
    ctx.fillStyle = "rgba(140,220,255,.55)";
    ctx.beginPath(); ctx.roundRect(-17, -28, 34, 54, 8); ctx.fill();
  } else if(z.slowed > 0){
    ctx.fillStyle = "rgba(90,184,224,.35)";
    ctx.beginPath(); ctx.roundRect(-17, -28, 34, 54, 8); ctx.fill();
    ctx.fillStyle = "rgba(180,230,255,.7)";
    ctx.beginPath(); ctx.arc(-12, -10, 2, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(10, -5, 1.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(8, 15, 2, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(-10, 20, 1.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -22, 1.8, 0, 7); ctx.fill();
  }
  ctx.restore();
  /* 防具血条 */
  if(z.maxHelmet > 0 && z.helmet > 0){
    const w = 28, hf = z.helmet/z.maxHelmet;
    ctx.fillStyle = "rgba(0,0,0,.4)";
    ctx.fillRect(cx-w/2, cy-52, w, 3.5);
    ctx.fillStyle = (z.kind==="buckethead"||z.kind==="football"||z.kind==="screendoor") ? "#aaa" : (z.kind==="newspaper" ? "#d8c8a0" : "#e8822a");
    ctx.fillRect(cx-w/2, cy-52, w*hf, 3.5);
  }
  /* 本体血条 */
  const maxHp = ZOMBIE_TYPES[z.kind] ? ZOMBIE_TYPES[z.kind].hp : ZOMBIE_HEALTH;
  if(z.hp < maxHp && !(z.maxHelmet > 0 && z.helmet > 0)){
    const w = 30, hpf = z.hp/maxHp;
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.fillRect(cx-w/2, cy-38, w, 4);
    ctx.fillStyle = hpf>0.5?"#7ec850":(hpf>0.25?"#f0a830":"#e0584c");
    ctx.fillRect(cx-w/2, cy-38, w*hpf, 4);
  }
}

/* ===== 绘制：阳光 ===== */
function drawSun(s){
  const r = 20;
  const pulse = 1 + Math.sin(s.anim*0.006)*0.08;
  const g = ctx.createRadialGradient(s.x,s.y,2,s.x,s.y,r*pulse*1.6);
  g.addColorStop(0,"rgba(255,230,120,.7)");
  g.addColorStop(1,"rgba(255,230,120,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(s.x,s.y,r*pulse*1.6,0,7); ctx.fill();
  ctx.fillStyle = "#ffd24a";
  ctx.beginPath(); ctx.arc(s.x,s.y,r*pulse,0,7); ctx.fill();
  ctx.fillStyle = "#ffe89a";
  ctx.beginPath(); ctx.arc(s.x-3,s.y-3,r*pulse*0.5,0,7); ctx.fill();
  ctx.strokeStyle = "rgba(255,210,74,.6)"; ctx.lineWidth = 2;
  for(let i=0;i<8;i++){
    const a = i*Math.PI/4 + s.anim*0.002;
    ctx.beginPath();
    ctx.moveTo(s.x+Math.cos(a)*r*pulse, s.y+Math.sin(a)*r*pulse);
    ctx.lineTo(s.x+Math.cos(a)*(r+5)*pulse, s.y+Math.sin(a)*(r+5)*pulse);
    ctx.stroke();
  }
}

/* ===== 绘制：子弹 ===== */
function drawBullet(b){
  if(b.spore){
    const r = b.puff ? 4.5 : 5.5;
    const wob = Math.sin((b.anim||0)*0.03 + b.x*0.05) * 0.8;
    ctx.fillStyle = "rgba(190,140,230,.35)";
    ctx.beginPath(); ctx.arc(b.x-6, b.y+wob, r*0.9, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(200,160,240,.45)";
    ctx.beginPath(); ctx.arc(b.x, b.y+wob, r+2.5, 0, 7); ctx.fill();
    ctx.fillStyle = b.puff ? "#b57ae0" : "#c78ad8";
    ctx.beginPath(); ctx.arc(b.x, b.y+wob, r, 0, 7); ctx.fill();
    ctx.fillStyle = "#eedcff";
    ctx.beginPath(); ctx.arc(b.x-1.5, b.y-1.5+wob, r*0.35, 0, 7); ctx.fill();
  } else if(b.ice){
    ctx.fillStyle = "rgba(90,184,224,.4)";
    ctx.beginPath(); ctx.arc(b.x,b.y,7,0,7); ctx.fill();
    ctx.fillStyle = "#5ab8e0";
    ctx.beginPath(); ctx.arc(b.x,b.y,5,0,7); ctx.fill();
    ctx.fillStyle = "#b0e8ff";
    ctx.beginPath(); ctx.arc(b.x-1,b.y-1,2,0,7); ctx.fill();
  } else {
    ctx.fillStyle = "rgba(108,187,60,.4)";
    ctx.beginPath(); ctx.arc(b.x,b.y,7,0,7); ctx.fill();
    ctx.fillStyle = "#7ec850";
    ctx.beginPath(); ctx.arc(b.x,b.y,5,0,7); ctx.fill();
    ctx.fillStyle = "#a8e07a";
    ctx.beginPath(); ctx.arc(b.x-1,b.y-1,2,0,7); ctx.fill();
  }
}

/* ===== 绘制：粒子 ===== */
function drawParticle(p){
  ctx.globalAlpha = p.life/p.maxLife;
  ctx.fillStyle = p.color;
  ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill();
  ctx.globalAlpha = 1;
}

/* ===== 卡片布局（按植物数量自适应） ===== */
function getCardLayout(){
  const n = curCardOrder.length;
  const cardY = 8, cardH = 78, gap = 4;
  const rightReserve = 200;
  const maxW = Math.min(58, Math.floor((W - rightReserve - 24 - (n+1)*gap) / (n + 0.8)));
  const cardW = Math.max(42, maxW);
  return { cardX0: 12, cardY, cardW, cardH, gap };
}

/* ===== 绘制：UI ===== */

  ctx.beginPath(); ctx.roundRect(-18, -28, 40, 56, 8); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = "#8b5a2b"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-6,-14); ctx.lineTo(6,16); ctx.stroke();
  ctx.fillStyle = shovelActive ? "#ffd24a" : "#c9a878";
  ctx.beginPath(); ctx.moveTo(-12,-18); ctx.lineTo(12,-18); ctx.lineTo(10,-8); ctx.lineTo(-10,-8); ctx.closePath(); ctx.fill();
  ctx.restore();
  const sx = W - 130;
  const sunGrad = ctx.createLinearGradient(sx, cardY, sx, cardY+36);
  sunGrad.addColorStop(0,"#fff8d8"); sunGrad.addColorStop(1,"#ffe8a0");
  ctx.fillStyle = sunGrad;
  ctx.strokeStyle = "#8b5a2b"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(sx, cardY, 114, 36, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#ffd24a";
  ctx.beginPath(); ctx.arc(sx+20, cardY+18, 11, 0, 7); ctx.fill();
  ctx.fillStyle = "#ffe89a";
  ctx.beginPath(); ctx.arc(sx+17, cardY+15, 4, 0, 7); ctx.fill();
  ctx.fillStyle = "#8b5a2b";
  ctx.font = "bold 18px sans-serif"; ctx.textAlign = "left";
  ctx.fillText(sun, sx+40, cardY+24);
  const pbX = W-260, pbY = cardY+44, pbW = 240, pbH = 22;
  ctx.fillStyle = "#4a3224";
  ctx.beginPath(); ctx.roundRect(pbX, pbY, pbW, pbH, 8); ctx.fill();
  if(isEndless()){
    const cycle = 10;
    const prog = (waveIndex % cycle) / cycle;
    const g = ctx.createLinearGradient(pbX,0,pbX+pbW,0);
    g.addColorStop(0,"#e8822a"); g.addColorStop(1,"#e04444");

    ctx.beginPath(); ctx.roundRect(pbX+2, pbY+2, Math.max(4,(pbW-4)*prog), pbH-4, 6); ctx.fill();

    ctx.beginPath(); ctx.roundRect(pbX+2, pbY+2, (pbW-4)*prog, pbH-4, 6); ctx.fill();

      ctx.beginPath(); ctx.moveTo(fx, pbY-2); ctx.lineTo(fx+10, pbY+3); ctx.lineTo(fx, pbY+8); ctx.closePath(); ctx.fill();

  const d = getDiff();

  ctx.fillText(modeLabel + " · " + d.name, 14, cardY+cardH+14);
  if(isEndless() && bestEndlessWave > 0){
    ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.font = "11px sans-serif";
    ctx.fillText("历史最佳 " + bestEndlessWave + " 波", 14, cardY+cardH+28);
  }
  if(bigWaveWarning > 0){
    ctx.fillStyle = "rgba(200,40,40,"+Math.min(bigWaveWarning/2000,0.5)+")";
    ctx.fillRect(0,0,W,H);
    if(bigWaveWarning > 1500){
      ctx.fillStyle = "#fff";
      ctx.font = "bold 28px sans-serif"; ctx.textAlign="center";
